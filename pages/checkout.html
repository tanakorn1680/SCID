<!DOCTYPE html>
<html lang="th">
<head>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ชำระเงิน</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
  :root{--navy:#1A6BA0;--sky:#2196C9;--gold:#D9A330;--gold-deep:#B9821F;--ink:#1A3A52;--line:rgba(26,106,160,0.18);--muted:rgba(26,58,82,0.55);--green-go:#3F8557;--danger:#E04433;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:#81CFF0;}
  body{font-family:'IBM Plex Sans Thai',sans-serif;color:var(--ink);min-height:100vh;padding:14px 14px 40px;-webkit-font-smoothing:antialiased;}
  .back-link{display:inline-flex;align-items:center;gap:5px;margin-bottom:12px;color:#fff;font-size:13px;font-weight:600;text-decoration:none;}
  .page-title{font-family:'Baloo 2',sans-serif;font-size:19px;font-weight:800;color:#fff;margin-bottom:14px;}
  .checkout-card{background:rgba(255,255,255,0.92);border:1.5px solid rgba(255,255,255,0.65);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 20px rgba(0,40,80,0.14);backdrop-filter:blur(8px);}
  .section-title{font-size:13.5px;font-weight:700;margin-bottom:12px;}
  .summary-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
  .summary-row.total{font-size:16px;font-weight:800;margin-top:10px;padding-top:10px;border-top:1.5px solid var(--line);}
  .summary-row.total .amount{color:var(--gold);font-family:'Baloo 2',sans-serif;}

  /* ยอดเฉพาะ — จุดหลัก */
  .unique-amount-box{background:linear-gradient(135deg,#0E4C7A,#1A6BA0);border-radius:14px;padding:20px;text-align:center;margin-bottom:14px;}
  .unique-amount-label{font-size:12px;color:rgba(255,255,255,0.7);margin-bottom:6px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
  .unique-amount-value{font-family:'Baloo 2',sans-serif;font-size:36px;font-weight:800;color:#FFD166;line-height:1;}
  .unique-amount-sub{font-size:11.5px;color:rgba(255,255,255,0.65);margin-top:8px;line-height:1.6;}
  .unique-amount-copy{margin-top:12px;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:12px;font-weight:700;padding:7px 18px;border-radius:20px;cursor:pointer;}
  .unique-amount-copy:active{background:rgba(255,255,255,0.25);}

  /* polling status */
  .polling-box{border:1.5px solid var(--line);border-radius:12px;padding:16px;text-align:center;margin-bottom:14px;}
  .polling-spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 10px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .polling-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .polling-sub{font-size:12px;color:var(--muted);line-height:1.6;}

  /* method select */
  .method-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .method-option{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s;}
  .method-option.selected{border-color:var(--navy);background:rgba(26,106,160,0.06);}
  .method-option:active{box-shadow:0 0 0 3px rgba(26,106,160,0.15);}
  .method-icon{display:flex;align-items:center;justify-content:center;width:28px;height:28px;flex-shrink:0;color:var(--navy);}
  .method-label{font-size:13.5px;font-weight:600;flex:1;}
  .method-detail-box{background:rgba(26,106,160,0.04);border-radius:12px;padding:14px;font-size:13px;line-height:1.7;}
  .method-detail-box .detail-row{display:flex;justify-content:space-between;}
  .method-detail-box .detail-row .val{font-family:'Space Mono',monospace;font-weight:700;}

  /* promptpay QR box */
  .promptpay-qr-box{text-align:center;padding:4px 0 8px;}
  .promptpay-qr-box canvas,.promptpay-qr-box img{border-radius:12px;max-width:200px;width:100%;display:block;margin:0 auto 10px;}
  .promptpay-qr-label{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
  .promptpay-qr-name{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:10px;letter-spacing:-.1px;}
  .promptpay-qr-amount{font-family:'Baloo 2',sans-serif;font-size:24px;font-weight:800;color:var(--gold-deep);margin-bottom:2px;}

  /* slip upload */
  .slip-upload-zone{border:2px dashed var(--line);border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
  .slip-upload-zone.has-preview{padding:12px;border-style:solid;}
  .slip-upload-zone:active{background:rgba(26,106,160,0.03);}
  .slip-preview-img{width:100%;max-height:260px;object-fit:contain;border-radius:8px;margin-bottom:10px;}
  .upload-icon{display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
  .upload-text{font-size:13px;color:var(--muted);}
  .upload-hint{font-size:11px;color:var(--muted);margin-top:4px;}
  .change-img-btn{font-size:12px;color:var(--navy);font-weight:600;background:none;border:none;cursor:pointer;text-decoration:underline;}

  .submit-slip-btn{width:100%;padding:14px 0;background:linear-gradient(135deg,var(--green-go) 0%,#2F6B43 100%);color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:700;font-family:'Baloo 2',sans-serif;cursor:pointer;margin-top:14px;box-shadow:0 4px 14px rgba(63,133,87,0.28);transition:opacity .18s,transform .12s cubic-bezier(.32,.72,0,1);}
  .submit-slip-btn:active{transform:scale(0.97);opacity:0.88;}
  .submit-slip-btn:disabled{opacity:0.45;cursor:not-allowed;box-shadow:none;}

  .form-alert{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;}
  .form-alert.show{display:block;}
  .form-alert.error{background:rgba(224,68,51,0.1);color:var(--danger);border:1px solid rgba(224,68,51,0.25);}
  .form-alert.success{background:rgba(63,133,87,0.1);color:var(--green-go);border:1px solid rgba(63,133,87,0.25);}
  .confirm-btn{width:100%;padding:14px 0;background:linear-gradient(135deg,var(--navy) 0%,#0E4C7A 100%);color:#fff;border:none;border-radius:11px;font-size:15.5px;font-weight:700;font-family:'Baloo 2',sans-serif;cursor:pointer;display:block;text-align:center;text-decoration:none;box-shadow:0 4px 14px rgba(26,106,160,0.28);}
  .skeleton{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.85);font-size:14px;}
  .reject-banner{background:rgba(224,68,51,0.1);border:1px solid rgba(224,68,51,0.3);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--danger);}
  .reject-banner strong{display:block;margin-bottom:4px;}
  .divider-text{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 14px;position:relative;}
  .divider-text::before,.divider-text::after{content:'';position:absolute;top:50%;width:35%;height:1px;background:var(--line);}
  .divider-text::before{left:0;} .divider-text::after{right:0;}

  /* ── Dialog overlay (แทน confirm/alert) ── */
  .sc-overlay{position:fixed;inset:0;background:rgba(10,30,50,0.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .18s ease;}
  .sc-overlay.sc-show{opacity:1;pointer-events:all;}
  .sc-box{background:rgba(255,255,255,0.97);border:1.5px solid rgba(255,255,255,0.7);border-radius:18px;padding:24px 20px 18px;max-width:320px;width:100%;box-shadow:0 8px 32px rgba(0,40,80,0.18);transform:scale(0.94) translateY(8px);transition:transform .22s cubic-bezier(.32,.72,0,1);}
  .sc-overlay.sc-show .sc-box{transform:scale(1) translateY(0);}
  .sc-title{font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:800;color:#1A3A52;margin-bottom:8px;}
  .sc-msg{font-size:13px;color:rgba(26,58,82,0.75);line-height:1.6;margin-bottom:18px;}
  .sc-actions{display:flex;gap:8px;justify-content:flex-end;}
  .sc-btn{padding:9px 20px;border-radius:9px;border:none;font-size:13px;font-weight:700;font-family:'IBM Plex Sans Thai',sans-serif;cursor:pointer;transition:opacity .15s,transform .12s cubic-bezier(.32,.72,0,1);}
  .sc-btn:active{transform:scale(0.96);opacity:0.85;}
  .sc-btn.sc-cancel{background:rgba(26,58,82,0.1);color:#1A3A52;}
  .sc-btn.sc-danger{background:#E04433;color:#fff;}
  .sc-btn.sc-ok{background:#1A6BA0;color:#fff;}

  /* ── Toast ── */
  #sc-toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);background:#323232;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;font-family:'IBM Plex Sans Thai',sans-serif;z-index:9999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);}
  #sc-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #sc-toast.error{background:#d93025;}
  #sc-toast.success{background:#188038;}
</style>
</head>
<body>

<a href="/pages/shop.html" class="back-link">← กลับหน้าสินค้า</a>
<div class="page-title">ชำระเงิน</div>

<div id="checkoutWrap">
  <div class="skeleton">กำลังโหลด...</div>
</div>

<script type="module">
import { auth, orders, paymentMethods, settings } from '../js/api.js';


// ── UI helpers (dialog + toast) ─────────────────────────────
const _ICONS = {
  success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  error:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
};
function _mkOverlay() {
  const o = document.createElement('div'); o.className = 'sc-overlay'; document.body.appendChild(o);
  requestAnimationFrame(() => requestAnimationFrame(() => o.classList.add('sc-show')));
  return o;
}
function _closeOverlay(o) {
  o.classList.remove('sc-show');
  o.addEventListener('transitionend', () => o.remove(), { once: true });
}
function showDialog({ title, msg, confirmLabel = 'ยืนยัน', confirmClass = 'sc-danger', onConfirm }) {
  const o = _mkOverlay();
  o.innerHTML = `<div class="sc-box"><div class="sc-title">${title}</div><div class="sc-msg">${msg}</div><div class="sc-actions"><button class="sc-btn sc-cancel" id="_scC">ยกเลิก</button><button class="sc-btn ${confirmClass}" id="_scOk">${confirmLabel}</button></div></div>`;
  o.addEventListener('click', e => { if (e.target === o) _closeOverlay(o); });
  o.querySelector('#_scC').addEventListener('click', () => _closeOverlay(o));
  o.querySelector('#_scOk').addEventListener('click', () => { _closeOverlay(o); onConfirm?.(); });
}
function showInfo(title, msg) {
  const o = _mkOverlay();
  o.innerHTML = `<div class="sc-box"><div class="sc-title">${title}</div><div class="sc-msg">${msg}</div><div class="sc-actions"><button class="sc-btn sc-ok" id="_scOk">ตกลง</button></div></div>`;
  o.addEventListener('click', e => { if (e.target === o) _closeOverlay(o); });
  o.querySelector('#_scOk').addEventListener('click', () => _closeOverlay(o));
}

// ── Toast ────────────────────────────────────────────────────
let _toastTimer;
function showToast(msg, type = '') {
  let el = document.getElementById('sc-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sc-toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = type ? `show ${type}` : 'show';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = ''; }, type === 'error' ? 3500 : 3000);
}



const session = await auth.getSession();
if (!session) { window.location.href = '/pages/login.html'; }

const params  = new URLSearchParams(window.location.search);
const orderId = params.get('order_id');
const wrap    = document.getElementById('checkoutWrap');
let selectedFile = null;
let pollingTimer = null;

if (!orderId) {
  wrap.innerHTML = `<div class="skeleton">ไม่พบ order_id</div>`;
} else {
  loadOrder();
}

async function loadOrder() {
  try {
    const { data: order } = await orders.detail(orderId);

    if (order.status === 'delivered') {
      stopPolling();
      wrap.innerHTML = `
        <div class="checkout-card">
          <div style="text-align:center;padding:20px 0;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--green-go)" stroke-width="1.8" style="margin-bottom:10px;"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div style="font-size:17px;font-weight:700;margin-bottom:8px;">ชำระเงินสำเร็จ!</div>
            <div style="font-size:13px;color:var(--muted);">ระบบได้รับและส่งสินค้าให้คุณแล้ว</div>
          </div>
        </div>
        <a href="/pages/history.html" class="confirm-btn">ดูประวัติการสั่งซื้อ</a>`;
      return;
    }

    if (order.status === 'awaiting_review') {
      stopPolling();
      renderAwaitingReview();
      return;
    }

    if (order.status === 'cancelled') {
      stopPolling();
      wrap.innerHTML = `
        <div class="checkout-card">
          <div style="text-align:center;padding:20px 0;">
            <div style="font-size:17px;font-weight:700;margin-bottom:8px;">ออเดอร์นี้ถูกยกเลิกแล้ว</div>
            <div style="font-size:13px;color:var(--muted);">กรุณาสั่งซื้อใหม่หากยังต้องการสินค้านี้</div>
          </div>
        </div>
        <a href="/pages/shop.html" class="confirm-btn">กลับไปหน้าสินค้า</a>`;
      return;
    }

    if (order.status === 'pending' && order.in_stock === false) {
      wrap.innerHTML = `
        <div class="checkout-card">
          <div style="text-align:center;padding:20px 0;">
            <div style="font-size:17px;font-weight:700;margin-bottom:8px;">สินค้านี้หมดชั่วคราว</div>
            <div style="font-size:13px;color:var(--muted);">กรุณาติดต่อแอดมิน หรือรอสินค้าเข้าใหม่</div>
          </div>
        </div>
        <a href="/pages/shop.html" class="confirm-btn">กลับไปหน้าสินค้า</a>`;
      return;
    }

    // pending + มีสต็อก → แสดงหน้าชำระเงิน
    renderPayment(order);

  } catch (e) {
    wrap.innerHTML = `<div class="skeleton">${e.message}</div>`;
  }
}

// ================================================================
// renderPayment — แสดงยอดเฉพาะ + polling + fallback สลิป
// ================================================================
function renderPayment(order) {
  const rejectBanner = order.reject_reason
    ? `<div class="reject-banner"><strong>สลิปถูกปฏิเสธ</strong>${order.reject_reason}<br><small>กรุณาส่งสลิปใหม่อีกครั้ง</small></div>`
    : '';

  const uniqueAmt = order.unique_amount
    ? Number(order.unique_amount).toFixed(2)
    : Number(order.amount).toFixed(2);

  wrap.innerHTML = `
    ${rejectBanner}

    <!-- สรุปออเดอร์ -->
    <div class="checkout-card">
      <div class="section-title">สรุปออเดอร์</div>
      <div class="summary-row"><span>${order.product_label}</span></div>
      <div class="summary-row total">
        <span>ยอดรวม</span>
        <span class="amount">฿${Number(order.amount).toLocaleString()}</span>
      </div>
    </div>

    <!-- ยอดเฉพาะที่ต้องโอน -->
    <div class="unique-amount-box">
      <div class="unique-amount-label">โอนยอดนี้เท่านั้น</div>
      <div class="unique-amount-value" id="uniqueAmtVal">฿${uniqueAmt}</div>
      <div class="unique-amount-sub">
        ยอดนี้ไม่ซ้ำกับออเดอร์อื่น<br>
        ระบบจะยืนยันการชำระเงินอัตโนมัติ
      </div>
      <button class="unique-amount-copy" id="copyAmtBtn">คัดลอกยอดเงิน</button>
    </div>

    <!-- เลือกช่องทางชำระเงิน -->
    <div class="checkout-card">
      <div class="section-title">ช่องทางชำระเงิน</div>
      <div class="method-list" id="methodList">
        <div style="text-align:center;padding:16px;color:var(--muted);font-size:13px;">กำลังโหลด...</div>
      </div>
      <div id="methodDetailWrap"></div>
    </div>

    <!-- polling: รอแอปจับ notification -->
    <div class="polling-box" id="pollingBox">
      <div class="polling-spinner"></div>
      <div class="polling-title">รอยืนยันการโอนเงิน</div>
      <div class="polling-sub">โอนเงินยอด <strong>฿${uniqueAmt}</strong> แล้วระบบจะยืนยันอัตโนมัติ<br>ภายใน 1–2 นาที</div>
    </div>

    <!-- fallback: อัปสลิปเอง -->
    <div class="divider-text">หรือหากระบบไม่ยืนยันอัตโนมัติ</div>
    <div class="checkout-card" id="slipCard">
      <div class="section-title">แนบสลิปด้วยตัวเอง</div>
      <div class="slip-upload-zone" id="uploadZone">
        <div class="upload-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
        <div class="upload-text">แตะเพื่อเลือกรูปสลิป</div>
        <div class="upload-hint">รองรับ JPG, PNG, WEBP (ไม่เกิน 5MB)</div>
      </div>
      <input type="file" id="slipFileInput" accept="image/jpeg,image/png,image/webp" style="display:none;">
      <button class="submit-slip-btn" id="submitSlipBtn" disabled>ส่งสลิป</button>
    </div>
  `;

  // copy ยอด
  document.getElementById('copyAmtBtn').addEventListener('click', async (e) => {
    await navigator.clipboard.writeText(uniqueAmt);
    e.target.textContent = 'คัดลอกแล้ว!';
    setTimeout(() => { e.target.textContent = 'คัดลอกยอดเงิน'; }, 1500);
  });

  // โหลดช่องทางชำระเงิน
  loadPaymentMethods(order);

  // เริ่ม polling
  startPolling();

  // slip upload
  const zone      = document.getElementById('uploadZone');
  const fileInput = document.getElementById('slipFileInput');
  const submitBtn = document.getElementById('submitSlipBtn');
  let selectedMethodId = null;

  function checkReady() { submitBtn.disabled = !(selectedFile && selectedMethodId); }
  window.__checkoutSetMethod = (id) => { selectedMethodId = id; checkReady(); };

  zone.addEventListener('click', () => {
    if (!zone.classList.contains('has-preview')) fileInput.click();
  });

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showAlert('ไฟล์ใหญ่เกิน 5MB'); return; }
    selectedFile = file;
    renderPreview(file);
    checkReady();
  });

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile || !selectedMethodId) return;
    submitBtn.disabled = true;
    submitBtn.textContent = 'กำลังส่งสลิป...';
    try {
      await orders.uploadSlip(orderId, selectedFile);
      // ส่งสลิปสำเร็จ — polling ยังทำงานต่อ รอ auto-approve
      const slipCard = document.getElementById('slipCard');
      if (slipCard) {
        slipCard.innerHTML = `
          <div style="text-align:center;padding:16px 0;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--green-go)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:8px;"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
            <div style="font-size:14px;font-weight:700;margin-bottom:4px;">ส่งสลิปสำเร็จ</div>
            <div style="font-size:12px;color:var(--muted);">กำลังรอยืนยันจากระบบ...</div>
          </div>`;
      }
      const divider = document.querySelector('.divider-text');
      if (divider) divider.style.display = 'none';
    } catch (e) {
      showAlert(e.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'ส่งสลิป';
    }
  });
}

// ================================================================
// Polling — ตรวจสถานะทุก 5 วินาที สูงสุด 30 นาที
// ================================================================
function startPolling() {
  let tries = 0;
  const MAX_TRIES = 600; // 30 นาที (600 × 3s)

  pollingTimer = setInterval(async () => {
    tries++;
    if (tries > MAX_TRIES) { stopPolling(); return; }

    try {
      const { data: order } = await orders.detail(orderId);

      if (order.status === 'delivered') {
        stopPolling();
        wrap.innerHTML = `
          <div class="checkout-card">
            <div style="text-align:center;padding:24px 0;">
              <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--green-go)" stroke-width="1.6" style="margin-bottom:12px;"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <div style="font-size:18px;font-weight:800;margin-bottom:8px;">ชำระเงินสำเร็จ!</div>
              <div style="font-size:13px;color:var(--muted);">ระบบยืนยันการโอนเงินอัตโนมัติแล้ว</div>
            </div>
          </div>
          <a href="/pages/history.html" class="confirm-btn">ดูสินค้าที่ได้รับ</a>`;
        return;
      }

      if (order.status === 'awaiting_review') {
        // สลิปถูกส่งแล้ว รอ auto-approve — poll ต่อ
        // หากรอนานเกิน 3 นาที (60 × 3s) ค่อยแสดงหน้า awaiting_review
        if (tries >= 60) {
          stopPolling();
          renderAwaitingReview();
        }
        return;
      }

    } catch (e) {
      // network error — polling ไปต่อ
    }
  }, 3000);
}

function stopPolling() {
  if (pollingTimer) { clearInterval(pollingTimer); pollingTimer = null; }
}

// ================================================================
// States
// ================================================================
function renderAwaitingReview() {
  wrap.innerHTML = `
    <div class="checkout-card">
      <div style="text-align:center;padding:20px 0;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--gold-deep)" stroke-width="1.8" style="margin-bottom:10px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <div style="font-size:17px;font-weight:700;margin-bottom:8px;">รอตรวจสอบ</div>
        <div style="font-size:13px;color:var(--muted);line-height:1.6;">
          ระบบได้รับสลิปของคุณแล้ว<br>กำลังรอแอดมินตรวจสอบ
        </div>
      </div>
    </div>
    <a href="/pages/history.html" class="confirm-btn">ดูประวัติการสั่งซื้อ</a>`;
}

// ================================================================
// Payment Methods
// ================================================================
async function loadPaymentMethods(order) {
  const listEl   = document.getElementById('methodList');
  const detailEl = document.getElementById('methodDetailWrap');

  try {
    const { data: methods } = await paymentMethods.list();

    if (!methods.length) {
      listEl.innerHTML = `<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px;">ยังไม่มีช่องทางชำระเงิน กรุณาติดต่อแอดมิน</div>`;
      return;
    }

    const icons = {
      promptpay: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="10" y1="18" x2="14" y2="18"/></svg>',
      bank: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="21" x2="21" y2="21"/><line x1="5" y1="21" x2="5" y2="10"/><line x1="19" y1="21" x2="19" y2="10"/><polygon points="12 3 3 8 21 8"/><line x1="9" y1="21" x2="9" y2="10"/><line x1="15" y1="21" x2="15" y2="10"/></svg>',
      truemoney: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-1"/><path d="M18 12h.01"/><path d="M21 8a2 2 0 0 1 0 8h-3a2 2 0 0 1 0-4h3"/></svg>',
      qr_code: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><line x1="14" y1="14" x2="14" y2="21"/><line x1="21" y1="14" x2="21" y2="21"/><line x1="17" y1="17" x2="17" y2="17.01"/></svg>',
    };

    listEl.innerHTML = methods.map(m => `
      <div class="method-option" data-method-id="${m.id}" onclick="window.__selectMethod('${m.id}')">
        <div class="method-icon">${icons[m.type] ?? icons.bank}</div>
        <div class="method-label">${m.label}</div>
      </div>
    `).join('');

    window.__methodsData = methods;

    window.__selectMethod = async (id) => {
      document.querySelectorAll('.method-option').forEach(el => {
        el.classList.toggle('selected', el.dataset.methodId === id);
      });
      const method = window.__methodsData.find(m => m.id === id);
      detailEl.innerHTML = renderMethodDetail(method, order);
      window.__checkoutSetMethod(id);
      // set payment method ทันทีที่เลือก ไม่รอตอนกด submit
      try { await orders.setPaymentMethod(orderId, id); } catch (_) { /* ไม่ block UI */ }
    };

  } catch (e) {
    listEl.innerHTML = `<div style="color:var(--danger);font-size:13px;padding:8px;">โหลดช่องทางชำระเงินไม่สำเร็จ</div>`;
  }
}

function renderMethodDetail(method, order) {
  const d = method.details || {};
  const uniqueAmt = order.unique_amount ? Number(order.unique_amount).toFixed(2) : Number(order.amount).toFixed(2);

  if (method.type === 'qr_code' && d.image_url) {
    return `
      <div class="method-detail-box" style="text-align:center;">
        <img src="${d.image_url}" alt="QR Code" style="max-width:220px;width:100%;border-radius:10px;margin-bottom:8px;">
        <div>สแกน QR Code โอน <strong>฿${uniqueAmt}</strong> เท่านั้น</div>
      </div>`;
  }
  if (method.type === 'promptpay') {
    const phoneId = d.promptpay_id ?? '';
    // render container ก่อน แล้วค่อย generate QR หลัง DOM พร้อม
    setTimeout(() => {
      const el = document.getElementById('promptpay-qr-canvas');
      if (!el || !phoneId) return;
      try {
        new QRCode(el, {
          text: buildPromptPayPayload(phoneId, parseFloat(uniqueAmt)),
          width: 200, height: 200,
          correctLevel: QRCode.CorrectLevel.M,
        });
      } catch(e) { el.textContent = 'สร้าง QR ไม่สำเร็จ'; }
    }, 0);
    return `
      <div class="method-detail-box">
        <div class="promptpay-qr-box">
          <div id="promptpay-qr-canvas"></div>
          ${d.account_name ? `<div class="promptpay-qr-name">${d.account_name}</div>` : ''}
          <div class="promptpay-qr-amount">฿${uniqueAmt}</div>
        </div>
      </div>`;
  }
  if (method.type === 'bank') {
    return `
      <div class="method-detail-box">
        <div class="detail-row"><span>ธนาคาร</span><span class="val">${d.bank_name ?? '-'}</span></div>
        <div class="detail-row"><span>เลขบัญชี</span><span class="val">${d.account_number ?? '-'}</span></div>
        <div class="detail-row"><span>ชื่อบัญชี</span><span class="val">${d.account_name ?? '-'}</span></div>
        <div class="detail-row" style="margin-top:8px;font-weight:700;color:var(--gold-deep);"><span>โอนยอด</span><span class="val">฿${uniqueAmt}</span></div>
      </div>`;
  }
  if (method.type === 'truemoney') {
    return `
      <div class="method-detail-box">
        <div class="detail-row"><span>TrueMoney</span><span class="val">${d.phone_number ?? '-'}</span></div>
        <div class="detail-row"><span>ชื่อบัญชี</span><span class="val">${d.account_name ?? '-'}</span></div>
        <div class="detail-row" style="margin-top:8px;font-weight:700;color:var(--gold-deep);"><span>โอนยอด</span><span class="val">฿${uniqueAmt}</span></div>
      </div>`;
  }
  return `<div class="method-detail-box">โอนยอด <strong>฿${uniqueAmt}</strong></div>`;
}

function renderPreview(file) {
  const reader = new FileReader();
  const zone = document.getElementById('uploadZone');
  reader.onload = (e) => {
    zone.className = 'slip-upload-zone has-preview';
    zone.innerHTML = `
      <img class="slip-preview-img" src="${e.target.result}" alt="ตัวอย่างสลิป">
      <button type="button" class="change-img-btn" id="changeImgBtn">เปลี่ยนรูป</button>
    `;
    document.getElementById('changeImgBtn').addEventListener('click', (ev) => {
      ev.stopPropagation();
      document.getElementById('slipFileInput').click();
    });
  };
  reader.readAsDataURL(file);
}

function showAlert(msg) { showToast(msg, 'error'); }

// ── PromptPay QR Generator (EMV Co. / BOT standard) ────────────────
function buildPromptPayPayload(phone, amount) {
  // normalize เบอร์โทร: ลบ +66 หรือ 0 นำหน้า แล้วแปลงเป็น 0XXXXXXXXX
  const digits = phone.replace(/\D/g, '');
  const normalized = digits.startsWith('66')
    ? '0' + digits.slice(2)
    : digits.startsWith('0') ? digits : '0' + digits;

  function tlv(tag, value) {
    return tag + value.length.toString().padStart(2, '0') + value;
  }
  function crc16(str) {
    let crc = 0xFFFF;
    for (let i = 0; i < str.length; i++) {
      crc ^= str.charCodeAt(i) << 8;
      for (let j = 0; j < 8; j++) {
        crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      }
    }
    return crc & 0xFFFF;
  }

  const amtStr = amount.toFixed(2);
  const ma     = tlv('29', tlv('00', 'A000000677010111') + tlv('01', normalized));
  const body   = [
    tlv('00', '01'),
    tlv('01', '12'),
    ma,
    tlv('53', '764'),
    tlv('54', amtStr),
    tlv('58', 'TH'),
    tlv('59', 'N/A'),
    tlv('60', 'Bangkok'),
    '6304',
  ].join('');
  return body + crc16(body).toString(16).toUpperCase().padStart(4, '0');
}
