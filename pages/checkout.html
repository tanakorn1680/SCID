<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ชำระเงิน</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
  :root{--navy:#1A6BA0;--sky:#2196C9;--gold:#D9A330;--gold-deep:#B9821F;--ink:#1A3A52;--line:rgba(26,106,160,0.18);--muted:rgba(26,58,82,0.55);--green-go:#3F8557;--danger:#E04433;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:#81CFF0;}
  body{font-family:'IBM Plex Sans Thai',sans-serif;color:var(--ink);min-height:100vh;padding:14px 14px 40px;-webkit-font-smoothing:antialiased;}
  .back-link{display:inline-flex;align-items:center;gap:5px;margin-bottom:12px;color:#fff;font-size:13px;font-weight:600;text-decoration:none;}
  .page-title{font-family:'Baloo 2',sans-serif;font-size:19px;font-weight:800;color:#fff;margin-bottom:14px;}
  .checkout-card{background:rgba(255,255,255,0.97);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,40,80,0.18);}
  .section-title{font-size:13.5px;font-weight:700;margin-bottom:12px;}
  .summary-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
  .summary-row.total{font-size:16px;font-weight:800;margin-top:10px;padding-top:10px;border-top:1.5px solid var(--line);}
  .summary-row.total .amount{color:var(--gold);font-family:'Baloo 2',sans-serif;}
  .qr-wrap{text-align:center;padding:16px;background:rgba(26,106,160,0.04);border-radius:12px;margin-bottom:14px;}
  .qr-wrap .qr-note{font-size:12px;color:var(--muted);margin-top:8px;}
  .pay-amount-highlight{text-align:center;padding:14px 0;margin-bottom:14px;}
  .pay-amount-highlight .amount{font-family:'Baloo 2',sans-serif;font-size:30px;font-weight:800;color:var(--gold);}
  .pay-amount-highlight .label{font-size:12px;color:var(--muted);}
  .slip-upload-zone{border:2px dashed var(--line);border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;transition:border-color .15s ease;}
  .slip-upload-zone.has-preview{padding:12px;border-style:solid;}
  .slip-preview-img{width:100%;max-height:260px;object-fit:contain;border-radius:8px;margin-bottom:10px;}
  .upload-icon{display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
  .upload-text{font-size:13px;color:var(--muted);}
  .upload-hint{font-size:11px;color:var(--muted);margin-top:4px;}
  .change-img-btn{font-size:12px;color:var(--navy);font-weight:600;background:none;border:none;cursor:pointer;text-decoration:underline;}
  .submit-slip-btn{width:100%;padding:14px 0;background:linear-gradient(135deg,var(--green-go) 0%,#2F6B43 100%);color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:700;font-family:'Baloo 2',sans-serif;cursor:pointer;margin-top:14px;}
  .submit-slip-btn:disabled{opacity:0.45;cursor:not-allowed;}
  .form-alert{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;}
  .form-alert.show{display:block;}
  .form-alert.error{background:rgba(224,68,51,0.1);color:var(--danger);border:1px solid rgba(224,68,51,0.25);}
  .form-alert.success{background:rgba(63,133,87,0.1);color:var(--green-go);border:1px solid rgba(63,133,87,0.25);}
  .confirm-btn{width:100%;padding:14px 0;background:linear-gradient(135deg,var(--navy) 0%,#0E4C7A 100%);color:#fff;border:none;border-radius:11px;font-size:15.5px;font-weight:700;font-family:'Baloo 2',sans-serif;cursor:pointer;display:block;text-align:center;text-decoration:none;}
  .confirm-btn:disabled{opacity:0.55;cursor:not-allowed;}
  .skeleton{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.85);font-size:14px;}
  .reject-banner{background:rgba(224,68,51,0.1);border:1px solid rgba(224,68,51,0.3);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--danger);}
  .reject-banner strong{display:block;margin-bottom:4px;}
  .method-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .method-option{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;transition:border-color .15s ease,background-color .15s ease;}
  .method-option.selected{border-color:var(--navy);background:rgba(26,106,160,0.06);}
  .method-icon{display:flex;align-items:center;justify-content:center;width:28px;height:28px;flex-shrink:0;color:var(--navy);}
  .method-label{font-size:13.5px;font-weight:600;flex:1;}
  .method-detail-box{background:rgba(26,106,160,0.04);border-radius:12px;padding:14px;font-size:13px;line-height:1.7;}
  .method-detail-box .detail-row{display:flex;justify-content:space-between;}
  .method-detail-box .detail-row .val{font-family:'Space Mono',monospace;font-weight:700;}
  .checkout-card{background:rgba(255,255,255,0.92);border:1.5px solid rgba(255,255,255,0.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,40,80,0.14);}
  .method-option{transition:border-color .15s,background .15s,box-shadow .15s;}
  .method-option:active{box-shadow:0 0 0 3px rgba(26,106,160,0.15);}
  .slip-upload-zone{transition:border-color .15s,background .15s;}
  .slip-upload-zone:active{background:rgba(26,106,160,0.03);}
  .submit-slip-btn{transition:opacity .18s,transform .12s cubic-bezier(.32,.72,0,1),box-shadow .18s;box-shadow:0 4px 14px rgba(63,133,87,0.28);}
  .submit-slip-btn:active{transform:scale(0.97);opacity:0.88;box-shadow:0 2px 6px rgba(63,133,87,0.15);}
  .submit-slip-btn:disabled{box-shadow:none;}
  .confirm-btn{transition:opacity .18s,transform .12s cubic-bezier(.32,.72,0,1),box-shadow .18s;box-shadow:0 4px 14px rgba(26,106,160,0.28);}
  .confirm-btn:active{transform:scale(0.97);opacity:0.88;box-shadow:0 2px 6px rgba(26,106,160,0.15);}
  .change-img-btn{transition:opacity .15s;}
  .change-img-btn:active{opacity:0.65;}
</style>
</head>
<body>

<a href="/pages/shop.html" class="back-link">← กลับหน้าสินค้า</a>
<div class="page-title">ชำระเงิน</div>

<div id="checkoutWrap">
  <div class="skeleton">กำลังโหลด...</div>
</div>

<script type="module">
import { auth, orders, paymentMethods } from '../js/api.js';

const session = await auth.getSession();
if (!session) { window.location.href = '/pages/login.html'; }

const params  = new URLSearchParams(window.location.search);
const orderId = params.get('order_id');
const wrap    = document.getElementById('checkoutWrap');
let selectedFile = null;

if (!orderId) {
  wrap.innerHTML = `<div class="skeleton">ไม่พบ order_id</div>`;
} else {
  loadOrder();
}

async function loadOrder() {
  try {
    const { data: order } = await orders.detail(orderId);

    if (order.status === 'delivered') {
      wrap.innerHTML = `
        <div class="checkout-card">
          <div style="text-align:center;padding:20px 0;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--green-go)" stroke-width="1.8" style="margin-bottom:10px;"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div style="font-size:17px;font-weight:700;margin-bottom:8px;">ออเดอร์นี้เสร็จสิ้นแล้ว</div>
          </div>
        </div>
        <a href="/pages/history.html" class="confirm-btn">ดูประวัติการสั่งซื้อ</a>`;
      return;
    }

    if (order.status === 'awaiting_review') {
      renderSuccess();
      return;
    }

    if (order.status === 'cancelled') {
      wrap.innerHTML = `
        <div class="checkout-card">
          <div style="text-align:center;padding:20px 0;">
            <div style="font-size:17px;font-weight:700;margin-bottom:8px;">ออเดอร์นี้ถูกยกเลิกแล้ว</div>
            <div style="font-size:13px;color:var(--muted);">กรุณาสั่งซื้อใหม่หากยังต้องการสินค้านี้</div>
          </div>
        </div>
        <a href="/pages/shop.html" class="confirm-btn">กลับไปหน้าสินค้า</a>`;
      return;
    }

    if (order.status === 'pending' && order.in_stock === false) {
      wrap.innerHTML = `
        <div class="checkout-card">
          <div style="text-align:center;padding:20px 0;">
            <div style="font-size:17px;font-weight:700;margin-bottom:8px;">สินค้านี้หมดชั่วคราว</div>
            <div style="font-size:13px;color:var(--muted);">กรุณาติดต่อแอดมิน หรือรอสินค้าเข้าใหม่</div>
          </div>
        </div>
        <a href="/pages/shop.html" class="confirm-btn">กลับไปหน้าสินค้า</a>`;
      return;
    }

    // pending และยังมีสต็อก — แสดงฟอร์มอัปโหลดสลิป
    renderPayment(order);
  } catch (e) {
    wrap.innerHTML = `<div class="skeleton">${e.message}</div>`;
  }
}

function renderPayment(order) {
  const rejectBanner = order.reject_reason
    ? `<div class="reject-banner"><strong>สลิปถูกปฏิเสธ</strong>${order.reject_reason}<br><small>กรุณาส่งสลิปใหม่อีกครั้ง</small></div>`
    : '';

  wrap.innerHTML = `
    ${rejectBanner}
    <div class="checkout-card">
      <div class="section-title">สรุปออเดอร์</div>
      <div class="summary-row"><span>${order.product_label}</span></div>
      <div class="summary-row total">
        <span>ยอดรวม</span>
        <span class="amount">฿${Number(order.amount).toLocaleString()}</span>
      </div>
    </div>

    <div class="checkout-card">
      <div class="section-title">เลือกช่องทางชำระเงิน</div>
      <div class="form-alert" id="methodAlert"></div>
      <div class="method-list" id="methodList">
        <div style="text-align:center;padding:16px;color:var(--muted);font-size:13px;">กำลังโหลดช่องทางชำระเงิน...</div>
      </div>
      <div id="methodDetailWrap"></div>
      <div class="pay-amount-highlight">
        <div class="label">ยอดที่ต้องชำระ</div>
        <div class="amount">฿${Number(order.amount).toLocaleString()}</div>
      </div>
    </div>

    <div class="checkout-card" id="slipCard" style="opacity:0.4;pointer-events:none;">
      <div class="section-title">แนบสลิปการโอนเงิน</div>
      <div class="form-alert" id="slipAlert"></div>
      <div class="slip-upload-zone" id="uploadZone">
        <div class="upload-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
        <div class="upload-text">แตะเพื่อเลือกรูปสลิป</div>
        <div class="upload-hint">รองรับ JPG, PNG, WEBP (ไม่เกิน 5MB) — กรุณาเลือกช่องทางชำระเงินก่อน</div>
      </div>
      <input type="file" id="slipFileInput" accept="image/jpeg,image/png,image/webp" style="display:none;">
      <button class="submit-slip-btn" id="submitSlipBtn" disabled>ส่งสลิป</button>
    </div>
  `;

  loadPaymentMethods(order);

  const zone     = document.getElementById('uploadZone');
  const fileInput = document.getElementById('slipFileInput');
  const submitBtn = document.getElementById('submitSlipBtn');
  let selectedMethodId = null;

  function checkReadyToSubmit() {
    submitBtn.disabled = !(selectedFile && selectedMethodId);
  }
  window.__checkoutSetMethod = (id) => { selectedMethodId = id; checkReadyToSubmit(); };

  zone.addEventListener('click', () => {
    if (!zone.classList.contains('has-preview')) fileInput.click();
  });

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) return showAlert('ไฟล์ใหญ่เกิน 5MB');
    selectedFile = file;
    renderPreview(file);
    checkReadyToSubmit();
  });

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile || !selectedMethodId) return;
    submitBtn.disabled = true;
    submitBtn.textContent = 'กำลังส่งสลิป...';
    try {
      await orders.setPaymentMethod(orderId, selectedMethodId);
      await orders.uploadSlip(orderId, selectedFile);
      renderSuccess();
    } catch (e) {
      showAlert(e.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'ส่งสลิป';
    }
  });
}

async function loadPaymentMethods(order) {
  const listEl   = document.getElementById('methodList');
  const detailEl = document.getElementById('methodDetailWrap');
  const alertEl  = document.getElementById('methodAlert');

  try {
    const { data: methods } = await paymentMethods.list();

    if (!methods.length) {
      listEl.innerHTML = `<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px;">ยังไม่มีช่องทางชำระเงินที่เปิดใช้งาน กรุณาติดต่อแอดมิน</div>`;
      return;
    }

    const icons = {
      promptpay: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="10" y1="18" x2="14" y2="18"/></svg>',
      bank: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="21" x2="21" y2="21"/><line x1="5" y1="21" x2="5" y2="10"/><line x1="19" y1="21" x2="19" y2="10"/><polygon points="12 3 3 8 21 8"/><line x1="9" y1="21" x2="9" y2="10"/><line x1="15" y1="21" x2="15" y2="10"/></svg>',
      truemoney: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-1"/><path d="M18 12h.01"/><path d="M21 8a2 2 0 0 1 0 8h-3a2 2 0 0 1 0-4h3"/></svg>',
      qr_code: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><line x1="14" y1="14" x2="14" y2="21"/><line x1="21" y1="14" x2="21" y2="21"/><line x1="17" y1="17" x2="17" y2="17.01"/></svg>',
    };
    const cardIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>';

    listEl.innerHTML = methods.map(m => `
      <div class="method-option" data-method-id="${m.id}" onclick="window.__selectMethod('${m.id}')">
        <div class="method-icon">${icons[m.type] ?? cardIcon}</div>
        <div class="method-label">${m.label}</div>
      </div>
    `).join('');

    window.__methodsData = methods;

    window.__selectMethod = (id) => {
      document.querySelectorAll('.method-option').forEach(el => {
        el.classList.toggle('selected', el.dataset.methodId === id);
      });

      const method = window.__methodsData.find(m => m.id === id);
      detailEl.innerHTML = renderMethodDetail(method, order);

      const slipCard = document.getElementById('slipCard');
      slipCard.style.opacity = '1';
      slipCard.style.pointerEvents = 'auto';
      document.querySelector('#slipCard .upload-hint').textContent = 'รองรับ JPG, PNG, WEBP (ไม่เกิน 5MB)';

      window.__checkoutSetMethod(id);
    };

  } catch (e) {
    alertEl.textContent = 'โหลดช่องทางชำระเงินไม่สำเร็จ';
    alertEl.className = 'form-alert show error';
  }
}

function renderMethodDetail(method, order) {
  const d = method.details || {};

  if (method.type === 'qr_code' && d.image_url) {
    return `
      <div class="method-detail-box" style="text-align:center;">
        <img src="${d.image_url}" alt="QR Code" style="max-width:220px;width:100%;border-radius:10px;margin-bottom:8px;">
        <div>สแกน QR Code เพื่อโอน ฿${Number(order.amount).toLocaleString()}</div>
      </div>`;
  }

  if (method.type === 'promptpay') {
    return `
      <div class="method-detail-box">
        <div class="detail-row"><span>PromptPay</span><span class="val">${d.promptpay_id ?? '-'}</span></div>
        <div class="detail-row"><span>ชื่อบัญชี</span><span class="val">${d.account_name ?? '-'}</span></div>
      </div>`;
  }

  if (method.type === 'bank') {
    return `
      <div class="method-detail-box">
        <div class="detail-row"><span>ธนาคาร</span><span class="val">${d.bank_name ?? '-'}</span></div>
        <div class="detail-row"><span>เลขบัญชี</span><span class="val">${d.account_number ?? '-'}</span></div>
        <div class="detail-row"><span>ชื่อบัญชี</span><span class="val">${d.account_name ?? '-'}</span></div>
      </div>`;
  }

  if (method.type === 'truemoney') {
    return `
      <div class="method-detail-box">
        <div class="detail-row"><span>TrueMoney</span><span class="val">${d.phone_number ?? '-'}</span></div>
        <div class="detail-row"><span>ชื่อบัญชี</span><span class="val">${d.account_name ?? '-'}</span></div>
      </div>`;
  }

  return `<div class="method-detail-box">โอนยอด ฿${Number(order.amount).toLocaleString()} ตามช่องทางที่เลือก</div>`;
}

function renderPreview(file) {
  const reader = new FileReader();
  const zone = document.getElementById('uploadZone');
  reader.onload = (e) => {
    zone.className = 'slip-upload-zone has-preview';
    zone.innerHTML = `
      <img class="slip-preview-img" src="${e.target.result}" alt="ตัวอย่างสลิป">
      <button type="button" class="change-img-btn" id="changeImgBtn">เปลี่ยนรูป</button>
    `;
    document.getElementById('changeImgBtn').addEventListener('click', (ev) => {
      ev.stopPropagation();
      document.getElementById('slipFileInput').click();
    });
  };
  reader.readAsDataURL(file);
}

function renderSuccess() {
  wrap.innerHTML = `
    <div class="checkout-card">
      <div style="text-align:center;padding:20px 0;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--green-go)" stroke-width="1.8" style="margin-bottom:10px;"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div style="font-size:17px;font-weight:700;margin-bottom:8px;">ส่งสลิปสำเร็จ</div>
        <div style="font-size:13px;color:var(--muted);line-height:1.6;">
          ระบบได้รับสลิปของคุณแล้ว<br>กำลังรอแอดมินตรวจสอบ
        </div>
      </div>
    </div>
    <a href="/pages/history.html" class="confirm-btn">ดูประวัติการสั่งซื้อ</a>
  `;
}

function showAlert(msg) {
  const el = document.getElementById('slipAlert');
  if (!el) return;
  el.textContent = msg;
  el.className = 'form-alert show error';
}
</script>
</body>
</html>
