<!DOCTYPE html>
<html lang="th">
<head>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สินค้าทั้งหมด</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap');
  :root{--paper:#FBF8F1;--navy:#1A6BA0;--sky:#2196C9;--gold:#D9A330;--gold-deep:#B9821F;--ink:#1A3A52;--line:rgba(26,106,160,0.18);--muted:rgba(26,58,82,0.55);--green-go:#3F8557;--danger:#E04433;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#81CFF0;overflow-x:hidden;}
  body{font-family:'IBM Plex Sans Thai',sans-serif;color:var(--ink);min-height:100vh;padding-bottom:30px;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;}
  .topbar img{height:34px;}
  .nav-actions{display:flex;gap:14px;align-items:center;font-size:13px;}
  .nav-actions a{color:var(--navy);text-decoration:none;font-weight:600;}
  .nav-actions button{background:none;border:none;color:var(--navy);font-size:13px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans Thai',sans-serif;}
  /* ── Hero Banner ── */
  .hero-banner{
    margin:0 16px 18px;
    border-radius:18px;
    padding:26px 22px;
    position:relative;
    overflow:hidden;
    background:rgba(255,255,255,0.82);
    border:1.5px solid rgba(255,255,255,0.6);
    box-shadow:0 4px 18px rgba(0,90,160,0.08);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .hero-banner::after{
    content:'';position:absolute;right:-28px;top:-28px;
    width:130px;height:130px;
    background:rgba(26,106,160,0.1);
    border-radius:50%;
    pointer-events:none;
  }
  .hero-title{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:800;margin-bottom:6px;position:relative;z-index:1;color:var(--ink);}
  .hero-sub{font-size:13px;color:rgba(26,58,82,0.7);position:relative;z-index:1;}
  .product-scroll-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 16px 8px;}
  .product-scroll-wrap::-webkit-scrollbar{display:none;}
  .product-grid{display:inline-flex;flex-direction:row;gap:12px;align-items:stretch;}
  .product-card{background:rgba(255,255,255,0.82);border:1.5px solid rgba(255,255,255,0.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(0,90,160,0.08);display:flex;flex-direction:column;width:155px;flex-shrink:0;}
  /* รูปภาพสินค้า — ถ้ามีรูปจริงจะซ่อน placeholder SVG */
  .product-img-wrap{width:100%;aspect-ratio:4/3;background:linear-gradient(135deg,#E8F2FA,#D4E9F7);display:flex;align-items:center;justify-content:center;color:#9DBDD6;flex-shrink:0;overflow:hidden;position:relative;}
  .product-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .product-img-wrap .placeholder-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9DBDD6;}
  /* badge จำนวนรูปเพิ่มเติม */
  .img-count-badge{position:absolute;bottom:5px;right:6px;background:rgba(0,0,0,0.48);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;line-height:1.4;pointer-events:none;}
  /* badge สินค้าหมด — มุมขวาบนของรูป */
  .out-of-stock-badge{position:absolute;top:8px;right:8px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;line-height:1.5;pointer-events:none;font-family:'IBM Plex Sans Thai',sans-serif;box-shadow:0 2px 6px rgba(224,68,51,0.35);}
  .product-info{padding:10px 11px 12px;display:flex;flex-direction:column;flex:1;}
  /* แถวชื่อ + จำนวนคงเหลือ */
  .product-name-row{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:6px;min-height:2.7em;}
  .product-name{font-size:13px;font-weight:700;line-height:1.35;flex:1;min-width:0;}
  .stock-count-badge{flex-shrink:0;font-size:10.5px;font-weight:600;color:var(--green-go);background:rgba(63,133,87,0.1);border:1px solid rgba(63,133,87,0.22);border-radius:20px;padding:2px 7px;line-height:1.5;white-space:nowrap;margin-top:1px;}
  .product-price{font-family:'Baloo 2',sans-serif;font-weight:800;color:var(--gold);font-size:15px;margin-bottom:4px;}
  .stock-line{font-size:11px;margin-bottom:6px;min-height:1.4em;}
  .stock-line.in-stock{color:var(--green-go);}
  .stock-line.out-of-stock{color:var(--danger);font-weight:600;}
  .spec-link{background:none;border:none;color:var(--sky);font-size:11px;font-weight:600;text-decoration:underline;cursor:pointer;padding:0 0 8px;text-align:left;font-family:'IBM Plex Sans Thai',sans-serif;min-height:1.6em;}
  .buy-btn{margin-top:auto;width:100%;padding:9px 0;background:var(--navy);color:#fff;border:none;border-radius:9px;font-size:12.5px;font-weight:700;font-family:'Baloo 2',sans-serif;cursor:pointer;}
  .buy-btn:active{opacity:0.85;}
  .buy-btn:disabled{background:rgba(26,58,82,0.25);cursor:not-allowed;}

  /* ── ตัด tap highlight flash ทั้งหน้า ── */
  *{-webkit-tap-highlight-color:transparent;}

  /* ── Spec Modal ── */
  .spec-modal-backdrop{position:fixed;inset:0;background:rgba(10,25,40,0.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s ease;}
  .spec-modal-backdrop.show{opacity:1;pointer-events:all;}
  .spec-modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:82vh;display:flex;flex-direction:column;padding:0 0 calc(16px + env(safe-area-inset-bottom));transform:translateY(48px);transition:transform .26s cubic-bezier(.32,.72,0,1);}
  .spec-modal-backdrop.show .spec-modal{transform:translateY(0);}
  /* Gallery strip ด้านบน modal */
  .gallery-wrap{flex-shrink:0;background:#000;border-radius:18px 18px 0 0;overflow:hidden;position:relative;aspect-ratio:4/3;display:none;}
  .gallery-wrap.has-images{display:block;}
  .gallery-main{width:100%;height:100%;object-fit:contain;background:#0d1c2b;}
  .gallery-thumb-strip{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:8px 14px;background:rgba(255,255,255,0.97);flex-shrink:0;}
  .gallery-thumb-strip::-webkit-scrollbar{display:none;}
  .gallery-thumb-strip.has-images{display:flex;}
  .gallery-thumb-strip{display:none;}
  .gallery-thumb{width:52px;height:52px;object-fit:cover;border-radius:7px;cursor:pointer;border:2.5px solid transparent;flex-shrink:0;transition:border-color 0.15s;}
  .gallery-thumb.active{border-color:var(--navy);}
  /* Modal body scroll */
  .spec-modal-body-wrap{padding:16px 18px 0;overflow-y:auto;flex:1;}
  .spec-modal-title{font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:800;margin-bottom:4px;}
  .spec-modal-price{color:var(--gold);font-weight:800;font-size:14px;margin-bottom:12px;}
  .spec-modal-body{white-space:pre-line;font-size:13px;line-height:1.75;color:var(--ink);}
  .spec-modal-close{margin:14px 18px 0;width:calc(100% - 36px);padding:11px 0;background:rgba(26,58,82,0.08);color:var(--ink);border:none;border-radius:9px;font-size:13px;font-weight:700;font-family:'Baloo 2',sans-serif;cursor:pointer;flex-shrink:0;}
  /* stock badge ใน modal */
  .spec-modal-stock{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:12px;}
  .spec-modal-stock.in-stock{background:rgba(63,133,87,0.1);color:var(--green-go);border:1px solid rgba(63,133,87,0.25);}
  .spec-modal-stock.out-of-stock{background:rgba(224,68,51,0.08);color:var(--danger);border:1px solid rgba(224,68,51,0.2);}
  .spec-modal-stock svg{flex-shrink:0;}

  /* ── Confirm Modal ── */
  .confirm-modal-backdrop{position:fixed;inset:0;background:rgba(10,25,40,0.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:8000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .18s ease;}
  .confirm-modal-backdrop.show{opacity:1;pointer-events:all;}
  .confirm-modal{background:rgba(255,255,255,0.97);border:1.5px solid rgba(255,255,255,0.7);border-radius:18px;width:100%;max-width:320px;padding:24px 20px 18px;box-shadow:0 8px 32px rgba(0,40,80,0.18);transform:scale(0.94) translateY(8px);transition:transform .22s cubic-bezier(.32,.72,0,1);}
  .confirm-modal-backdrop.show .confirm-modal{transform:scale(1) translateY(0);}
  .confirm-modal-title{font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:800;color:#1A3A52;margin-bottom:12px;}
  .confirm-modal-summary{background:rgba(26,106,160,0.06);border-radius:12px;padding:14px;margin-bottom:18px;}
  .confirm-modal-product{font-size:14px;font-weight:700;color:#1A3A52;margin-bottom:4px;}
  .confirm-modal-price{font-family:'Baloo 2',sans-serif;font-weight:800;color:var(--gold);font-size:18px;}
  .confirm-modal-actions{display:flex;gap:8px;justify-content:flex-end;}
  .confirm-modal-actions button{padding:9px 20px;border:none;border-radius:9px;font-size:13px;font-weight:700;font-family:'IBM Plex Sans Thai',sans-serif;cursor:pointer;transition:opacity .15s,transform .12s cubic-bezier(.32,.72,0,1);}
  .confirm-modal-actions button:active{transform:scale(0.96);opacity:0.85;}
  .confirm-modal-cancel{background:rgba(26,58,82,0.1);color:#1A3A52;}
  .confirm-modal-ok{background:#3A7D44;color:#fff;}

  .loading-state,.empty-state{grid-column:1/-1;text-align:center;padding:50px 20px;color:rgba(255,255,255,0.75);font-size:14px;}

  /* ── Hamburger Menu ── */
  .topbar{position:relative;}
  .menu-btn{background:none;border:none;cursor:pointer;padding:7px;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:9px;transition:background .15s;}
  .menu-btn:active{background:rgba(255,255,255,0.15);}
  .menu-dropdown{position:absolute;top:calc(100% + 4px);right:16px;background:rgba(255,255,255,0.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1.5px solid rgba(255,255,255,0.6);border-radius:18px;box-shadow:0 4px 18px rgba(0,90,160,0.10);min-width:180px;overflow:hidden;opacity:0;pointer-events:none;transform:translateY(-8px);transition:opacity .18s,transform .18s;z-index:200;}
  .menu-dropdown.open{opacity:1;pointer-events:all;transform:translateY(0);}
  .menu-item{display:flex;align-items:center;gap:10px;padding:13px 16px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;font-family:'IBM Plex Sans Thai',sans-serif;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .12s;}
  .menu-item:hover,.menu-item:active{background:rgba(255,255,255,0.25);}
  .menu-item svg{flex-shrink:0;opacity:0.8;}
  .menu-item.admin-item{color:var(--navy);}
  .menu-item.danger{color:var(--danger);}
  .menu-divider{height:1px;background:rgba(255,255,255,0.3);margin:3px 0;}
  .category-section{margin-bottom:6px;}
  .category-title{font-family:'Baloo 2',sans-serif;font-size:15px;font-weight:700;color:#fff;margin:18px 0 10px;padding:0 16px;text-shadow:0 1px 4px rgba(0,40,80,0.3);}

  /* ── Dialog overlay (แทน confirm/alert) ── */
  .sc-overlay{position:fixed;inset:0;background:rgba(10,30,50,0.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .18s ease;}
  .sc-overlay.sc-show{opacity:1;pointer-events:all;}
  .sc-box{background:rgba(255,255,255,0.97);border:1.5px solid rgba(255,255,255,0.7);border-radius:18px;padding:24px 20px 18px;max-width:320px;width:100%;box-shadow:0 8px 32px rgba(0,40,80,0.18);transform:scale(0.94) translateY(8px);transition:transform .22s cubic-bezier(.32,.72,0,1);}
  .sc-overlay.sc-show .sc-box{transform:scale(1) translateY(0);}
  .sc-title{font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:800;color:#1A3A52;margin-bottom:8px;}
  .sc-msg{font-size:13px;color:rgba(26,58,82,0.75);line-height:1.6;margin-bottom:18px;}
  .sc-actions{display:flex;gap:8px;justify-content:flex-end;}
  .sc-btn{padding:9px 20px;border-radius:9px;border:none;font-size:13px;font-weight:700;font-family:'IBM Plex Sans Thai',sans-serif;cursor:pointer;transition:opacity .15s,transform .12s cubic-bezier(.32,.72,0,1);}
  .sc-btn:active{transform:scale(0.96);opacity:0.85;}
  .sc-btn.sc-cancel{background:rgba(26,58,82,0.1);color:#1A3A52;}
  .sc-btn.sc-danger{background:#E04433;color:#fff;}
  .sc-btn.sc-ok{background:#1A6BA0;color:#fff;}

  /* ── Toast ── */
  #sc-toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);background:#323232;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;font-family:'IBM Plex Sans Thai',sans-serif;z-index:9999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);}
  #sc-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #sc-toast.error{background:#d93025;}
  #sc-toast.success{background:#188038;}
  /* announcement bar */
  .announce-bar{background:rgba(217,163,48,0.15);border-bottom:1px solid rgba(217,163,48,0.3);padding:8px 14px;font-size:12.5px;font-weight:600;color:#7a5800;text-align:center;display:none;}
  .announce-bar.show{display:block;}
  /* shop closed banner */
  .closed-bar{background:rgba(224,68,51,0.1);border:1.5px solid rgba(224,68,51,0.2);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:13px;font-weight:600;color:var(--danger);text-align:center;display:none;}
  .closed-bar.show{display:block;}
  /* footer */
  .shop-footer{text-align:center;padding:20px 14px 8px;font-size:12px;color:rgba(255,255,255,0.65);}
  .shop-footer .contact-btns{display:flex;justify-content:center;gap:10px;margin-bottom:10px;}
  .contact-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;text-decoration:none;border:none;cursor:pointer;font-family:'IBM Plex Sans Thai',sans-serif;}
  .contact-btn.line{background:#06C755;color:#fff;}
  .contact-btn.fb{background:#1877F2;color:#fff;}
</style>
</head>
<body>

<div class="announce-bar" id="announceBar"></div>
<div class="topbar">
  <img id="siteLogo" src="../images/logo-main-service1.png" alt="logo">
  <button class="menu-btn" id="menuBtn" aria-label="เมนู">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="menu-dropdown" id="menuDropdown"></div>
</div>

<div class="hero-banner">
  <div class="hero-title">ไอดี SimCity BuildIt</div>
  <div class="hero-sub" id="heroSub"> </div>
</div>

<div class="closed-bar" id="closedBar"></div>
<div id="productGrid">
  <div class="loading-state" style="padding:50px 20px;text-align:center;color:rgba(255,255,255,0.75);">กำลังโหลดสินค้า...</div>
</div>

<!-- ── Spec + Gallery Modal ── -->
<div class="spec-modal-backdrop" id="specModalBackdrop">
  <div class="spec-modal">
    <!-- Gallery: แสดงเฉพาะถ้าสินค้ามีรูป -->
    <div class="gallery-wrap" id="galleryWrap">
      <img class="gallery-main" id="galleryMain" src="" alt="product image">
    </div>
    <div class="gallery-thumb-strip" id="galleryThumbStrip"></div>
    <!-- ข้อความ spec -->
    <div class="spec-modal-body-wrap">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px;">
        <div class="spec-modal-title" id="specModalTitle" style="margin-bottom:0;flex:1;min-width:0;"></div>
        <div id="specModalStock" style="flex-shrink:0;margin-top:2px;"></div>
      </div>
      <div class="spec-modal-price" id="specModalPrice"></div>
      <div class="spec-modal-body" id="specModalBody"></div>
    </div>
    <button class="spec-modal-close" id="specModalCloseBtn">ปิด</button>
  </div>
</div>

<!-- ── Confirm Modal ── -->
<div class="confirm-modal-backdrop" id="confirmModalBackdrop">
  <div class="confirm-modal">
    <div class="confirm-modal-title">ยืนยันการสั่งซื้อ</div>
    <div class="confirm-modal-summary">
      <div class="confirm-modal-product" id="confirmModalProduct"></div>
      <div class="confirm-modal-price" id="confirmModalPrice"></div>
    </div>
    <div class="confirm-modal-actions">
      <button class="confirm-modal-cancel" id="confirmModalCancelBtn">ยกเลิก</button>
      <button class="confirm-modal-ok" id="confirmModalOkBtn">ยืนยัน</button>
    </div>
  </div>
</div>

<script type="module">
import { auth, products, orders, settings } from '../js/api.js';


// ── UI helpers (dialog + toast) ─────────────────────────────
const _ICONS = {
  success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  error:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
};
function _mkOverlay() {
  const o = document.createElement('div'); o.className = 'sc-overlay'; document.body.appendChild(o);
  requestAnimationFrame(() => requestAnimationFrame(() => o.classList.add('sc-show')));
  return o;
}
function _closeOverlay(o) {
  o.classList.remove('sc-show');
  o.addEventListener('transitionend', () => o.remove(), { once: true });
}
function showDialog({ title, msg, confirmLabel = 'ยืนยัน', confirmClass = 'sc-danger', onConfirm }) {
  const o = _mkOverlay();
  o.innerHTML = `<div class="sc-box"><div class="sc-title">${title}</div><div class="sc-msg">${msg}</div><div class="sc-actions"><button class="sc-btn sc-cancel" id="_scC">ยกเลิก</button><button class="sc-btn ${confirmClass}" id="_scOk">${confirmLabel}</button></div></div>`;
  o.addEventListener('click', e => { if (e.target === o) _closeOverlay(o); });
  o.querySelector('#_scC').addEventListener('click', () => _closeOverlay(o));
  o.querySelector('#_scOk').addEventListener('click', () => { _closeOverlay(o); onConfirm?.(); });
}
function showInfo(title, msg) {
  const o = _mkOverlay();
  o.innerHTML = `<div class="sc-box"><div class="sc-title">${title}</div><div class="sc-msg">${msg}</div><div class="sc-actions"><button class="sc-btn sc-ok" id="_scOk">ตกลง</button></div></div>`;
  o.addEventListener('click', e => { if (e.target === o) _closeOverlay(o); });
  o.querySelector('#_scOk').addEventListener('click', () => _closeOverlay(o));
}

// ── Toast ────────────────────────────────────────────────────
let _toastTimer;
function showToast(msg, type = '') {
  let el = document.getElementById('sc-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sc-toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = type ? `show ${type}` : 'show';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = ''; }, type === 'error' ? 3500 : 3000);
}



// โหลด settings จาก Website Settings
settings.get().then(({ data }) => {
  // theme colors — override CSS variables + background
  if (data.bg_color) {
    document.documentElement.style.setProperty('--bg-color', data.bg_color);
    document.documentElement.style.background = data.bg_color;
    document.body.style.background = data.bg_color;
  }
  if (data.primary_color) {
    document.documentElement.style.setProperty('--navy', data.primary_color);
    // derive darker shade สำหรับ hover state
    document.documentElement.style.setProperty('--sky', data.primary_color);
  }
  // logo
  if (data.logo_url) document.getElementById('siteLogo').src = data.logo_url;
  // hero title
  if (data.site_name) {
    const t = document.querySelector('.hero-title');
    if (t) t.textContent = data.site_name;
  }
  // hero subtitle
  if (data.home_text) document.getElementById('heroSub').textContent = data.home_text;
  // announcement bar
  if (data.announcement) {
    const bar = document.getElementById('announceBar');
    bar.textContent = data.announcement;
    bar.classList.add('show');
  }
  // shop closed
  const isOpen = data.is_open !== 'false';
  if (!isOpen) {
    const bar = document.getElementById('closedBar');
    bar.textContent = data.closed_msg || 'ขณะนี้ปิดรับออเดอร์ชั่วคราว';
    bar.classList.add('show');
    // disable buy buttons
    document.querySelectorAll('.buy-btn').forEach(btn => {
      btn.disabled = true;
      btn.style.opacity = '0.45';
    });
  }
  // footer
  if (data.footer_text) document.getElementById('footerText').textContent = data.footer_text;
  // contact buttons
  const contactBtns = document.getElementById('contactBtns');
  let btnsHtml = '';
  if (data.line_id) {
    const lineUrl = data.line_id.startsWith('http') ? data.line_id : `https://line.me/ti/p/${data.line_id.replace('@','')}`;
    btnsHtml += `<a href="${lineUrl}" target="_blank" rel="noopener" class="contact-btn line">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.02 2 11c0 3.36 1.92 6.3 4.8 8.1L6 22l3.27-1.73C10.14 20.72 11.05 21 12 21c5.52 0 10-4.02 10-9s-4.48-9-10-9z"/></svg>
      Line</a>`;
  }
  if (data.facebook_url) {
    btnsHtml += `<a href="${data.facebook_url}" target="_blank" rel="noopener" class="contact-btn fb">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
      Facebook</a>`;
  }
  contactBtns.innerHTML = btnsHtml;
}).catch(() => {});

// ตรวจ session
const session = await auth.getSession();
const menuBtn      = document.getElementById('menuBtn');
const menuDropdown = document.getElementById('menuDropdown');

// SVG icons สำหรับ menu items
const iconHistory = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
const iconAdmin   = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`;
const iconLogout  = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`;
const iconLogin   = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>`;

if (!session) {
  menuDropdown.innerHTML = `
    <a href="/pages/login.html" class="menu-item">${iconLogin} เข้าสู่ระบบ</a>
  `;
} else {
  const res = await fetch('/api/auth/profile', {
    headers: { Authorization: `Bearer ${session.access_token}` }
  });
  const { data: profile } = await res.json();
  const adminItem = profile?.role === 'admin'
    ? `<a href="/pages/admin/dashboard.html" class="menu-item admin-item">${iconAdmin} แอดมิน</a><div class="menu-divider"></div>`
    : '';

  menuDropdown.innerHTML = `
    ${adminItem}
    <a href="/pages/history.html" class="menu-item">${iconHistory} ประวัติคำสั่งซื้อ</a>
    <div class="menu-divider"></div>
    <button class="menu-item danger" id="logoutBtn">${iconLogout} ออกจากระบบ</button>
  `;

  document.getElementById('logoutBtn').addEventListener('click', () => {
    showDialog({
      title: 'ยืนยันออกจากระบบ',
      msg: 'ต้องการออกจากระบบหรือไม่?',
      confirmLabel: 'ออกจากระบบ',
      confirmClass: 'sc-danger',
      onConfirm: async () => { await auth.logout(); window.location.reload(); },
    });
  });
}

// toggle dropdown
menuBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  menuDropdown.classList.toggle('open');
});

// ปิด dropdown เมื่อคลิกที่อื่น
document.addEventListener('click', () => menuDropdown.classList.remove('open'));

// ── helper: สร้าง HTML ส่วนรูปภาพของ card (รับ overlay เช่น badge สินค้าหมด) ──
function buildCardImage(images, overlay = '') {
  const cover = images.find(img => img.is_cover) ?? images[0] ?? null;
  if (!cover) {
    return `
      <div class="product-img-wrap">
        <div class="placeholder-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="8" width="20" height="10" rx="4"/>
            <path d="M6 12h4M8 10v4"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="13" r="1"/>
          </svg>
        </div>
        ${overlay}
      </div>`;
  }
  return `
    <div class="product-img-wrap">
      <img src="${cover.url}" alt="product" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
      <div class="placeholder-icon" style="display:none;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="8" width="20" height="10" rx="4"/>
          <path d="M6 12h4M8 10v4"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="13" r="1"/>
        </svg>
      </div>
      ${overlay}
    </div>`;
}

// โหลดสินค้า
const grid = document.getElementById('productGrid');
try {
  const { data } = await products.list();
  if (!data.length) {
    grid.innerHTML = `<div class="empty-state" style="padding:50px 20px;text-align:center;color:rgba(255,255,255,0.75);">ยังไม่มีสินค้า</div>`;
  } else {
    // จัดกลุ่มตาม category
    const seen = new Map();
    const apiOrder = [];
    for (const p of data) {
      if (!seen.has(p.category)) { seen.set(p.category, []); apiOrder.push(p.category); }
      seen.get(p.category).push(p);
    }
    // apply ลำดับ category ที่แอดมินบันทึกไว้ใน site_settings
    let grouped = apiOrder;
    try {
      const settingsData = await settings.get().then(r => r.data).catch(() => ({}));
      const savedOrder = JSON.parse(settingsData.category_order ?? 'null');
      if (Array.isArray(savedOrder) && savedOrder.length) {
        const known = savedOrder.filter(c => seen.has(c));
        const extra = apiOrder.filter(c => !known.includes(c));
        grouped = [...known, ...extra];
      }
    } catch(_) {}

    grid.innerHTML = grouped.map(category => `
      <div class="category-section">
        <div class="category-title">${category}</div>
        <div class="product-scroll-wrap">
          <div class="product-grid">
            ${seen.get(category).map(p => {
              const inStock  = p.stock_count > 0;
              const images   = p.images ?? [];
              const hasSpec  = !!p.spec;
              const hasImg   = images.length > 0;
              // ถ้ามีรูปหรือมี spec → ปุ่มดูรายละเอียด
              const specBtn  = (hasSpec || hasImg)
                ? `<button class="spec-link" onclick='openSpecModal(${JSON.stringify(p)})'>ดูรายละเอียด</button>`
                : `<span class="spec-link" style="visibility:hidden;display:block;">ดูรายละเอียด</span>`;
              // badge สินค้าหมด — แสดงบนรูปเสมอเมื่อหมด
              const oosOverlay = !inStock
                ? `<div class="out-of-stock-badge">สินค้าหมด</div>`
                : '';
              // จำนวนคงเหลือ — แสดงมุมขวาของชื่อเฉพาะตอนมีสินค้า
              // (ถ้ามี spec/รูป → stock แสดงใน modal แทน ไม่ต้องซ้ำบน card)
              const stockBadge = (inStock && !(hasSpec || hasImg))
                ? `<span class="stock-count-badge">เหลือ ${p.stock_count}</span>`
                : '';
              return `
              <div class="product-card">
                ${buildCardImage(images, oosOverlay)}
                <div class="product-info">
                  <div class="product-name-row">
                    <div class="product-name">${p.label}</div>
                    ${stockBadge}
                  </div>
                  <div class="product-price">ราคา ${Number(p.price).toLocaleString()} บาท</div>
                  ${specBtn}
                  <button class="buy-btn" onclick='buyProduct(${JSON.stringify({ key: p.key, label: p.label, price: p.price })})' ${inStock ? '' : 'disabled'}>
                    ซื้อ
                  </button>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
    `).join('');
  }
} catch {
  grid.innerHTML = `<div class="empty-state" style="padding:50px 20px;text-align:center;color:rgba(255,255,255,0.75);">โหลดสินค้าไม่สำเร็จ</div>`;
}

// ── Gallery helper ──────────────────────────────────────────
const galleryWrap       = document.getElementById('galleryWrap');
const galleryMain       = document.getElementById('galleryMain');
const galleryThumbStrip = document.getElementById('galleryThumbStrip');

function buildGallery(images) {
  if (!images.length) {
    galleryWrap.classList.remove('has-images');
    galleryThumbStrip.classList.remove('has-images');
    galleryThumbStrip.style.display = 'none';
    return;
  }

  // ปก = is_cover=true หรือรูปแรกถ้าไม่มี
  const coverIdx = images.findIndex(img => img.is_cover);
  const startIdx = coverIdx >= 0 ? coverIdx : 0;

  galleryMain.src = images[startIdx].url;
  galleryWrap.classList.add('has-images');

  // Thumbnails (ซ่อนถ้ามีรูปเดียว)
  if (images.length > 1) {
    galleryThumbStrip.style.display = 'flex';
    galleryThumbStrip.classList.add('has-images');
    galleryThumbStrip.innerHTML = images.map((img, i) => `
      <img class="gallery-thumb ${i === startIdx ? 'active' : ''}"
           src="${img.url}" alt="thumb ${i + 1}" loading="lazy"
           data-idx="${i}">
    `).join('');

    galleryThumbStrip.querySelectorAll('.gallery-thumb').forEach(thumb => {
      thumb.addEventListener('click', () => {
        const idx = Number(thumb.dataset.idx);
        galleryMain.src = images[idx].url;
        galleryThumbStrip.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
        thumb.classList.add('active');
        // scroll thumbnail ให้อยู่กึ่งกลาง
        thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      });
    });
  } else {
    galleryThumbStrip.style.display = 'none';
    galleryThumbStrip.classList.remove('has-images');
  }
}

// ── Modal ดูรายละเอียดสเปค + Gallery ──────────────────────
const specBackdrop = document.getElementById('specModalBackdrop');

window.openSpecModal = (product) => {
  const images = product.images ?? [];
  document.getElementById('specModalTitle').textContent = product.label;
  document.getElementById('specModalPrice').textContent = `ราคา ${Number(product.price).toLocaleString()} บาท`;
  document.getElementById('specModalBody').textContent = product.spec ?? '';

  // stock badge
  const stockEl = document.getElementById('specModalStock');
  const inStock = (product.stock_count ?? 0) > 0;
  stockEl.innerHTML = inStock
    ? `<span style="font-size:12px;color:var(--green-go);font-weight:600;background:rgba(63,133,87,0.1);border:1px solid rgba(63,133,87,0.22);border-radius:20px;padding:2px 8px;white-space:nowrap;">เหลือ ${product.stock_count} ชิ้น</span>`
    : `<span style="font-size:12px;color:var(--danger);font-weight:600;background:rgba(224,68,51,0.08);border:1px solid rgba(224,68,51,0.2);border-radius:20px;padding:2px 8px;white-space:nowrap;">สินค้าหมด</span>`;

  buildGallery(images);
  specBackdrop.classList.add('show');
};

function closeSpecModal() {
  specBackdrop.classList.remove('show');
  // รอ transition จบ (~260ms) แล้วค่อย reset gallery state
  setTimeout(() => {
    galleryMain.src = '';
    galleryThumbStrip.innerHTML = '';
  }, 280);
}

document.getElementById('specModalCloseBtn').addEventListener('click', closeSpecModal);
specBackdrop.addEventListener('click', (e) => {
  if (e.target === specBackdrop) closeSpecModal();
});

// ── Modal ยืนยันการสั่งซื้อ ─────────────────────────────────
const confirmBackdrop = document.getElementById('confirmModalBackdrop');
let pendingProduct = null;

window.buyProduct = (product) => {
  if (!session) return window.location.href = '/pages/login.html';
  pendingProduct = product;
  document.getElementById('confirmModalProduct').textContent = product.label;
  document.getElementById('confirmModalPrice').textContent = `ราคา ${Number(product.price).toLocaleString()} บาท`;
  confirmBackdrop.classList.add('show');
};

function closeConfirmModal() {
  confirmBackdrop.classList.remove('show');
  pendingProduct = null;
}

document.getElementById('confirmModalCancelBtn').addEventListener('click', closeConfirmModal);
confirmBackdrop.addEventListener('click', (e) => {
  if (e.target === confirmBackdrop) closeConfirmModal();
});

document.getElementById('confirmModalOkBtn').addEventListener('click', async () => {
  if (!pendingProduct) return;
  const product = pendingProduct;
  const btn = document.getElementById('confirmModalOkBtn');
  btn.disabled = true; btn.textContent = 'กำลังสั่งซื้อ...';
  try {
    const { data } = await orders.create(product.key);
    window.location.href = `/pages/checkout.html?order_id=${data.id}`;
  } catch (e) {
    showToast(e.message, 'error');
    btn.disabled = false; btn.textContent = 'ยืนยัน';
  }
});
</script>
<div class="shop-footer">
  <div class="contact-btns" id="contactBtns"></div>
  <div id="footerText"></div>
</div>
</body>
</html>
