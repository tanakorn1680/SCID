<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap');
  :root{--navy:#1A6BA0;--gold:#D9A330;--ink:#1A3A52;--green-go:#3F8557;--danger:#E04433;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'IBM Plex Sans Thai',sans-serif;background:#F0F4F8;color:var(--ink);min-height:100vh;padding:20px 16px 40px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .page-title{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:800;}
  .logout-btn{background:none;border:none;color:rgba(26,58,82,0.5);font-size:13px;cursor:pointer;font-family:'IBM Plex Sans Thai',sans-serif;}
  .nav-links{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .nav-link{padding:9px 16px;background:var(--navy);color:#fff;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:7px;}
  .nav-link svg{width:15px;height:15px;flex-shrink:0;}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
  @media(min-width:600px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
  .stat-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 10px rgba(0,40,80,0.08);}
  .stat-card.urgent::before{content:'';display:block;width:4px;height:100%;position:absolute;left:0;top:0;background:var(--danger);border-radius:12px 0 0 12px;}
  .stat-card{position:relative;overflow:hidden;}
  .stat-label{font-size:12px;color:rgba(26,58,82,0.55);margin-bottom:6px;}
  .stat-value{font-family:'Baloo 2',sans-serif;font-size:26px;font-weight:800;}
  .stat-value.go{color:var(--green-go);}
  .stat-value.urgent{color:var(--danger);}
  .loading{color:rgba(26,58,82,0.4);font-size:13px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="page-title">Admin Dashboard</div>
  <button class="logout-btn" id="logoutBtn">ออกจากระบบ</button>
</div>

<div class="nav-links">
  <a href="/pages/admin/orders.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg> ออเดอร์</a>
  <a href="/pages/admin/products.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="20" height="10" rx="4"/><path d="M6 12h4M8 10v4"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="13" r="1"/></svg> สินค้า</a>
  <a href="/pages/admin/inventory.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg> คลังไอดี</a>
  <a href="/pages/admin/customers.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> สมาชิก</a>
  <a href="/pages/admin/payment-methods.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> ช่องทางชำระเงิน</a>
  <a href="/pages/admin/settings.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> ตั้งค่าเว็บไซต์</a>
  <a href="/pages/admin/admin-settings.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> ตั้งค่าผู้ดูแลระบบ</a>
</div>

<div class="stat-grid" id="statGrid">
  <div class="stat-card"><div class="stat-label">กำลังโหลด...</div></div>
</div>

<script type="module">
import { auth, admin } from '../../js/api.js';

const session = await auth.getSession();
if (!session) { window.location.href = '/pages/login.html'; }

// ตรวจ admin role
const res = await fetch('/api/auth/profile', { headers: { Authorization: `Bearer ${session.access_token}` } });
const { data: profile } = await res.json();
if (profile?.role !== 'admin') { window.location.href = '/pages/shop.html'; }

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await auth.logout();
  window.location.href = '/pages/login.html';
});

// โหลด stats
try {
  const { data: s } = await admin.stats();
  document.getElementById('statGrid').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">ยอดขายวันนี้</div>
      <div class="stat-value go">฿${Number(s.revenue_today).toLocaleString()}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">ยอดขายเดือนนี้</div>
      <div class="stat-value go">฿${Number(s.revenue_month).toLocaleString()}</div>
    </div>
    <div class="stat-card urgent">
      <div class="stat-label">ออเดอร์รออนุมัติ</div>
      <div class="stat-value urgent">${s.pending_review}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">ไอดีพร้อมขาย</div>
      <div class="stat-value">${s.inventory_ready}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">สมาชิกทั้งหมด</div>
      <div class="stat-value">${s.total_customers}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">จำนวนสินค้า</div>
      <div class="stat-value">${s.product_count}</div>
    </div>
  `;
} catch {
  document.getElementById('statGrid').innerHTML = `<div class="loading">โหลด stats ไม่สำเร็จ</div>`;
}
</script>
</body>
</html>
