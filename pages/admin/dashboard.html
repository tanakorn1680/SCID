<!DOCTYPE html>
<html lang="th">
<head>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap');
  :root{--navy:#1A6BA0;--gold:#D9A330;--ink:#1A3A52;--green:#3F8557;--danger:#E04433;--line:rgba(26,106,160,0.14);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'IBM Plex Sans Thai',sans-serif;background:#81CFF0;color:var(--ink);min-height:100vh;padding:0 0 40px;}

  /* ── Topbar ── */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 16px;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
    gap:10px;
  }
  .topbar-left{display:flex;align-items:center;gap:10px;}
  .shop-link{
    display:inline-flex;align-items:center;gap:5px;
    color:var(--navy);font-size:13px;font-weight:600;
    text-decoration:none;
    background:rgba(26,106,160,0.08);
    padding:6px 11px;border-radius:8px;
  }
  .shop-link svg{width:14px;height:14px;flex-shrink:0;}
  .shop-link:active{opacity:.8;}
  .page-title{font-family:'Baloo 2',sans-serif;font-size:17px;font-weight:800;}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .logout-btn{background:none;border:none;color:rgba(26,58,82,0.45);font-size:13px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans Thai',sans-serif;padding:6px 10px;border-radius:8px;}
  .logout-btn:active{background:rgba(26,58,82,0.06);}

  /* ── Wrap ── */
  .wrap{padding:16px 14px 0;}

  /* ── Stat grid ── */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
  @media(min-width:480px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
  .stat-card{background:#fff;border-radius:13px;padding:14px;box-shadow:0 2px 10px rgba(0,40,80,0.08);position:relative;overflow:hidden;}
  .stat-card.alert::before{content:'';position:absolute;left:0;top:0;width:4px;height:100%;background:var(--danger);}
  .s-label{font-size:11.5px;color:rgba(26,58,82,0.5);margin-bottom:4px;}
  .s-val{font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:800;}
  .s-val.green{color:var(--green);}
  .s-val.red{color:var(--danger);}

  /* ── Section label ── */
  .section-label{font-size:11px;font-weight:700;color:rgba(26,58,82,0.42);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;}

  /* ── Nav links (เมนูหน้าต่างๆ) ── */
  .nav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media(min-width:360px){.nav-grid{grid-template-columns:repeat(3,1fr);}}
  .nav-link{
    background:#fff;border-radius:12px;
    padding:14px 12px;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    font-size:12.5px;font-weight:600;color:var(--ink);
    text-decoration:none;
    box-shadow:0 2px 8px rgba(0,40,80,0.07);
    transition:opacity .15s;
    text-align:center;
    position:relative;
  }
  .nav-link:active{opacity:.75;}
  .nav-link svg{width:22px;height:22px;color:var(--navy);}
  .nav-link span{line-height:1.3;}
  .nav-badge{
    position:absolute;top:-6px;right:-6px;
    min-width:20px;height:20px;padding:0 5px;
    background:var(--danger);color:#fff;
    font-size:10.5px;font-weight:800;border-radius:20px;
    display:flex;align-items:center;justify-content:center;
    border:2px solid #81CFF0;line-height:1;
    pointer-events:none;
  }
  .nav-badge.hide{display:none;}
  .topbar{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .stat-card{background:rgba(255,255,255,0.92);border:1.5px solid rgba(255,255,255,0.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .12s cubic-bezier(.32,.72,0,1);}
  .stat-card:active{transform:scale(0.98);}
  .pill-link{background:rgba(255,255,255,0.92);border:1.5px solid rgba(255,255,255,0.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .12s cubic-bezier(.32,.72,0,1),background .15s;}
  .pill-link:active{transform:scale(0.96);background:rgba(26,106,160,0.08);}
  .nav-link{background:rgba(255,255,255,0.92);border:1.5px solid rgba(255,255,255,0.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(0,40,80,0.08);transition:transform .12s cubic-bezier(.32,.72,0,1);}
  .nav-link:active{transform:scale(0.96);opacity:1;}
  .shop-link{transition:transform .12s cubic-bezier(.32,.72,0,1),opacity .15s;}
  .shop-link:active{transform:scale(0.96);}
  .logout-btn{transition:background .15s,transform .12s cubic-bezier(.32,.72,0,1);}
  .logout-btn:active{transform:scale(0.96);background:rgba(26,58,82,0.08);}

  /* ── Dialog overlay (แทน confirm/alert) ── */
  .sc-overlay{position:fixed;inset:0;background:rgba(10,30,50,0.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .18s ease;}
  .sc-overlay.sc-show{opacity:1;pointer-events:all;}
  .sc-box{background:rgba(255,255,255,0.97);border:1.5px solid rgba(255,255,255,0.7);border-radius:18px;padding:24px 20px 18px;max-width:320px;width:100%;box-shadow:0 8px 32px rgba(0,40,80,0.18);transform:scale(0.94) translateY(8px);transition:transform .22s cubic-bezier(.32,.72,0,1);}
  .sc-overlay.sc-show .sc-box{transform:scale(1) translateY(0);}
  .sc-title{font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:800;color:#1A3A52;margin-bottom:8px;}
  .sc-msg{font-size:13px;color:rgba(26,58,82,0.75);line-height:1.6;margin-bottom:18px;}
  .sc-actions{display:flex;gap:8px;justify-content:flex-end;}
  .sc-btn{padding:9px 20px;border-radius:9px;border:none;font-size:13px;font-weight:700;font-family:'IBM Plex Sans Thai',sans-serif;cursor:pointer;transition:opacity .15s,transform .12s cubic-bezier(.32,.72,0,1);}
  .sc-btn:active{transform:scale(0.96);opacity:0.85;}
  .sc-btn.sc-cancel{background:rgba(26,58,82,0.1);color:#1A3A52;}
  .sc-btn.sc-danger{background:#E04433;color:#fff;}
  .sc-btn.sc-ok{background:#1A6BA0;color:#fff;}

  /* ── Toast ── */
  #sc-toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);background:#323232;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;font-family:'IBM Plex Sans Thai',sans-serif;z-index:9999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);}
  #sc-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #sc-toast.error{background:#d93025;}
  #sc-toast.success{background:#188038;}
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-left">
    <a href="/pages/shop.html" class="shop-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      หน้าร้าน
    </a>
    <div class="page-title">Dashboard</div>
  </div>
  <div class="topbar-right">
    <button class="logout-btn" id="logoutBtn">ออกจากระบบ</button>
  </div>
</div>

<div class="wrap">

  <!-- Stats -->
  <div class="stat-grid" id="statGrid">
    <div class="stat-card"><div class="s-label">กำลังโหลด...</div></div>
  </div>

  <!-- Nav links -->
  <div class="section-label">เมนูจัดการ</div>
  <div class="nav-grid">
    <a href="/pages/admin/orders.html" class="nav-link" id="navOrders">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>ออเดอร์</span>
      <span class="nav-badge hide" id="orderBadge"></span>
    </a>
    <a href="/pages/admin/products.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="20" height="10" rx="4"/><path d="M6 12h4M8 10v4"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="13" r="1"/></svg>
      <span>สินค้า</span>
    </a>
    <a href="/pages/admin/inventory.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
      <span>คลังไอดี</span>
    </a>
    <a href="/pages/admin/customers.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>สมาชิก</span>
    </a>
    <a href="/pages/admin/payment-methods.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span>ช่องทางชำระเงิน</span>
    </a>
    <a href="/pages/admin/settings.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>ตั้งค่าเว็บไซต์</span>
    </a>
    <a href="/pages/admin/admin-settings.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>ตั้งค่าแอดมิน</span>
    </a>
  </div>

</div>

<script type="module">
import { auth, admin } from '../../js/api.js';


// ── UI helpers (dialog + toast) ─────────────────────────────
const _ICONS = {
  success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  error:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
};
function _mkOverlay() {
  const o = document.createElement('div'); o.className = 'sc-overlay'; document.body.appendChild(o);
  requestAnimationFrame(() => requestAnimationFrame(() => o.classList.add('sc-show')));
  return o;
}
function _closeOverlay(o) {
  o.classList.remove('sc-show');
  o.addEventListener('transitionend', () => o.remove(), { once: true });
}
function showDialog({ title, msg, confirmLabel = 'ยืนยัน', confirmClass = 'sc-danger', onConfirm }) {
  const o = _mkOverlay();
  o.innerHTML = `<div class="sc-box"><div class="sc-title">${title}</div><div class="sc-msg">${msg}</div><div class="sc-actions"><button class="sc-btn sc-cancel" id="_scC">ยกเลิก</button><button class="sc-btn ${confirmClass}" id="_scOk">${confirmLabel}</button></div></div>`;
  o.addEventListener('click', e => { if (e.target === o) _closeOverlay(o); });
  o.querySelector('#_scC').addEventListener('click', () => _closeOverlay(o));
  o.querySelector('#_scOk').addEventListener('click', () => { _closeOverlay(o); onConfirm?.(); });
}
function showInfo(title, msg) {
  const o = _mkOverlay();
  o.innerHTML = `<div class="sc-box"><div class="sc-title">${title}</div><div class="sc-msg">${msg}</div><div class="sc-actions"><button class="sc-btn sc-ok" id="_scOk">ตกลง</button></div></div>`;
  o.addEventListener('click', e => { if (e.target === o) _closeOverlay(o); });
  o.querySelector('#_scOk').addEventListener('click', () => _closeOverlay(o));
}

// ── Toast ────────────────────────────────────────────────────
let _toastTimer;
function showToast(msg, type = '') {
  let el = document.getElementById('sc-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sc-toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = type ? `show ${type}` : 'show';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = ''; }, type === 'error' ? 3500 : 3000);
}



// ── Auth ────────────────────────────────────────────────────
const session = await auth.getSession();
if (!session) { window.location.href = '/pages/login.html'; }
const res = await fetch('/api/auth/profile', { headers: { Authorization: `Bearer ${session.access_token}` } });
const { data: profile } = await res.json();
if (profile?.role !== 'admin') { window.location.href = '/pages/shop.html'; }

document.getElementById('logoutBtn').addEventListener('click', () => {
  showDialog({
    title: 'ยืนยันออกจากระบบ',
    msg: 'ต้องการออกจากระบบหรือไม่?',
    confirmLabel: 'ออกจากระบบ',
    confirmClass: 'sc-danger',
    onConfirm: async () => { await auth.logout(); window.location.href = '/pages/login.html'; },
  });
});

// ── Stats + order badge ────────────────────────────────────
const SEEN_KEY = 'dashboard_seen_order_count';

function updateOrderBadge(currentCount) {
  const badge = document.getElementById('orderBadge');
  const seenCount = parseInt(localStorage.getItem(SEEN_KEY) || '0', 10);
  const newOrders = currentCount - seenCount;
  if (newOrders > 0) {
    badge.textContent = newOrders > 99 ? '99+' : newOrders;
    badge.classList.remove('hide');
  } else {
    badge.classList.add('hide');
  }
}

// เมื่อกดไปหน้าออเดอร์ ให้ mark seen = currentCount
document.getElementById('navOrders').addEventListener('click', () => {
  const badge = document.getElementById('orderBadge');
  // อ่าน total จาก badge dataset ที่เก็บไว้
  const total = parseInt(document.getElementById('navOrders').dataset.orderTotal || '0', 10);
  localStorage.setItem(SEEN_KEY, total);
  badge.classList.add('hide');
});

try {
  const { data: s } = await admin.stats();

  document.getElementById('statGrid').innerHTML = `
    <div class="stat-card">
      <div class="s-label">ยอดขายวันนี้</div>
      <div class="s-val green">฿${Number(s.revenue_today).toLocaleString()}</div>
    </div>
    <div class="stat-card">
      <div class="s-label">ยอดขายเดือนนี้</div>
      <div class="s-val green">฿${Number(s.revenue_month).toLocaleString()}</div>
    </div>
    <div class="stat-card alert">
      <div class="s-label">รออนุมัติ</div>
      <div class="s-val red">${s.pending_review}</div>
    </div>
    <div class="stat-card">
      <div class="s-label">ไอดีพร้อมขาย</div>
      <div class="s-val">${s.inventory_ready}</div>
    </div>
    <div class="stat-card">
      <div class="s-label">สมาชิก</div>
      <div class="s-val">${s.total_customers}</div>
    </div>
    <div class="stat-card">
      <div class="s-label">สินค้า</div>
      <div class="s-val">${s.product_count}</div>
    </div>`;

  // นับ awaiting_review สำหรับ badge
  const pendingCount = Number(s.pending_review) || 0;
  document.getElementById('navOrders').dataset.orderTotal = pendingCount;
  updateOrderBadge(pendingCount);

} catch {
  document.getElementById('statGrid').innerHTML =
    `<div class="stat-card"><div class="s-label">โหลด stats ไม่สำเร็จ</div></div>`;
}

// ── Favicon จาก site settings ──
</script>
</body>
</html>
