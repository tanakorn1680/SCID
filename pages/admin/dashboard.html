<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap');
  :root{--navy:#1A6BA0;--gold:#D9A330;--ink:#1A3A52;--green:#3F8557;--danger:#E04433;--line:rgba(26,106,160,0.14);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'IBM Plex Sans Thai',sans-serif;background:#81CFF0;color:var(--ink);min-height:100vh;padding:0 0 40px;}

  /* ── Topbar ── */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 16px;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
    gap:10px;
  }
  .topbar-left{display:flex;align-items:center;gap:10px;}
  .shop-link{
    display:inline-flex;align-items:center;gap:5px;
    color:var(--navy);font-size:13px;font-weight:600;
    text-decoration:none;
    background:rgba(26,106,160,0.08);
    padding:6px 11px;border-radius:8px;
  }
  .shop-link svg{width:14px;height:14px;flex-shrink:0;}
  .shop-link:active{opacity:.8;}
  .page-title{font-family:'Baloo 2',sans-serif;font-size:17px;font-weight:800;}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .logout-btn{background:none;border:none;color:rgba(26,58,82,0.45);font-size:13px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans Thai',sans-serif;padding:6px 10px;border-radius:8px;}
  .logout-btn:active{background:rgba(26,58,82,0.06);}

  /* ── Wrap ── */
  .wrap{padding:16px 14px 0;}

  /* ── Stat grid ── */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
  @media(min-width:480px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
  .stat-card{background:#fff;border-radius:13px;padding:14px;box-shadow:0 2px 10px rgba(0,40,80,0.08);position:relative;overflow:hidden;}
  .stat-card.alert::before{content:'';position:absolute;left:0;top:0;width:4px;height:100%;background:var(--danger);}
  .s-label{font-size:11.5px;color:rgba(26,58,82,0.5);margin-bottom:4px;}
  .s-val{font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:800;}
  .s-val.green{color:var(--green);}
  .s-val.red{color:var(--danger);}

  /* ── Section label ── */
  .section-label{font-size:11px;font-weight:700;color:rgba(26,58,82,0.42);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;}

  /* ── Order pills (แบบในรูป) ── */
  .pills-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-bottom:20px;}
  .pills-scroll::-webkit-scrollbar{display:none;}
  .pills-row{display:inline-flex;gap:8px;white-space:nowrap;padding:2px 0;}
  .pill-link{
    position:relative;
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 16px;
    background:#fff;border:1.5px solid var(--line);border-radius:50px;
    font-size:13px;font-weight:600;font-family:'IBM Plex Sans Thai',sans-serif;
    color:var(--ink);text-decoration:none;
    white-space:nowrap;transition:border-color .15s,background .15s;
  }
  .pill-link:active{background:rgba(26,106,160,0.06);}
  .pill-link svg{width:14px;height:14px;flex-shrink:0;}
  /* badge จำนวน */
  .pill-badge{
    position:absolute;top:-6px;right:-6px;
    min-width:18px;height:18px;padding:0 4px;
    background:var(--danger);color:#fff;
    font-size:10px;font-weight:800;border-radius:20px;
    display:flex;align-items:center;justify-content:center;
    border:2px solid #F0F4F8;line-height:1;
  }
  .pill-badge.hide{display:none;}

  /* ── Nav links (เมนูหน้าต่างๆ) ── */
  .nav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media(min-width:360px){.nav-grid{grid-template-columns:repeat(3,1fr);}}
  .nav-link{
    background:#fff;border-radius:12px;
    padding:14px 12px;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    font-size:12.5px;font-weight:600;color:var(--ink);
    text-decoration:none;
    box-shadow:0 2px 8px rgba(0,40,80,0.07);
    transition:opacity .15s;
    text-align:center;
  }
  .nav-link:active{opacity:.75;}
  .nav-link svg{width:22px;height:22px;color:var(--navy);}
  .nav-link span{line-height:1.3;}
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-left">
    <a href="/pages/shop.html" class="shop-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      หน้าร้าน
    </a>
    <div class="page-title">Dashboard</div>
  </div>
  <div class="topbar-right">
    <button class="logout-btn" id="logoutBtn">ออกจากระบบ</button>
  </div>
</div>

<div class="wrap">

  <!-- Stats -->
  <div class="stat-grid" id="statGrid">
    <div class="stat-card"><div class="s-label">กำลังโหลด...</div></div>
  </div>

  <!-- Order status pills -->
  <div class="section-label">ออเดอร์แยกตามสถานะ</div>
  <div class="pills-scroll">
    <div class="pills-row" id="pillsRow">
      <!-- render จาก JS หลังโหลด stats -->
      <a class="pill-link" href="/pages/admin/orders.html?status=awaiting_review">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        รอตรวจสลิป
        <span class="pill-badge hide" id="badge-awaiting_review">0</span>
      </a>
      <a class="pill-link" href="/pages/admin/orders.html?status=pending">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        รอชำระเงิน
        <span class="pill-badge hide" id="badge-pending">0</span>
      </a>
      <a class="pill-link" href="/pages/admin/orders.html?status=delivered">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        ส่งแล้ว
        <span class="pill-badge hide" id="badge-delivered">0</span>
      </a>
      <a class="pill-link" href="/pages/admin/orders.html?status=cancelled">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        ยกเลิก
        <span class="pill-badge hide" id="badge-cancelled">0</span>
      </a>
      <a class="pill-link" href="/pages/admin/orders.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        ทั้งหมด
      </a>
    </div>
  </div>

  <!-- Nav links -->
  <div class="section-label">เมนูจัดการ</div>
  <div class="nav-grid">
    <a href="/pages/admin/orders.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>ออเดอร์</span>
    </a>
    <a href="/pages/admin/products.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="20" height="10" rx="4"/><path d="M6 12h4M8 10v4"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="13" r="1"/></svg>
      <span>สินค้า</span>
    </a>
    <a href="/pages/admin/inventory.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
      <span>คลังไอดี</span>
    </a>
    <a href="/pages/admin/customers.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>สมาชิก</span>
    </a>
    <a href="/pages/admin/payment-methods.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span>ช่องทางชำระเงิน</span>
    </a>
    <a href="/pages/admin/settings.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>ตั้งค่าเว็บไซต์</span>
    </a>
    <a href="/pages/admin/admin-settings.html" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>ตั้งค่าแอดมิน</span>
    </a>
  </div>

</div>

<script type="module">
import { auth, admin } from '../../js/api.js';

// ── Auth ────────────────────────────────────────────────────
const session = await auth.getSession();
if (!session) { window.location.href = '/pages/login.html'; }
const res = await fetch('/api/auth/profile', { headers: { Authorization: `Bearer ${session.access_token}` } });
const { data: profile } = await res.json();
if (profile?.role !== 'admin') { window.location.href = '/pages/shop.html'; }

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await auth.logout();
  window.location.href = '/pages/login.html';
});

// ── Stats + badge counts ────────────────────────────────────
try {
  const { data: s } = await admin.stats();

  document.getElementById('statGrid').innerHTML = `
    <div class="stat-card">
      <div class="s-label">ยอดขายวันนี้</div>
      <div class="s-val green">฿${Number(s.revenue_today).toLocaleString()}</div>
    </div>
    <div class="stat-card">
      <div class="s-label">ยอดขายเดือนนี้</div>
      <div class="s-val green">฿${Number(s.revenue_month).toLocaleString()}</div>
    </div>
    <div class="stat-card alert">
      <div class="s-label">รออนุมัติ</div>
      <div class="s-val red">${s.pending_review}</div>
    </div>
    <div class="stat-card">
      <div class="s-label">ไอดีพร้อมขาย</div>
      <div class="s-val">${s.inventory_ready}</div>
    </div>
    <div class="stat-card">
      <div class="s-label">สมาชิก</div>
      <div class="s-val">${s.total_customers}</div>
    </div>
    <div class="stat-card">
      <div class="s-label">สินค้า</div>
      <div class="s-val">${s.product_count}</div>
    </div>`;

  // badge รอตรวจสลิป จาก stats
  const pendingCount = Number(s.pending_review) || 0;
  if (pendingCount > 0) {
    const badge = document.getElementById('badge-awaiting_review');
    badge.textContent = pendingCount > 99 ? '99+' : pendingCount;
    badge.classList.remove('hide');
  }

  // โหลด order counts แบบ parallel เพื่ออัป badge ที่เหลือ
  const STATUSES = ['pending', 'delivered', 'cancelled'];
  Promise.all(
    STATUSES.map(status => admin.orders({ status }).then(({ data }) => ({ status, count: data.length })))
  ).then(results => {
    results.forEach(({ status, count }) => {
      if (count > 0) {
        const badge = document.getElementById(`badge-${status}`);
        if (badge) {
          badge.textContent = count > 99 ? '99+' : count;
          badge.classList.remove('hide');
        }
      }
    });
  }).catch(() => {});

} catch {
  document.getElementById('statGrid').innerHTML =
    `<div class="stat-card"><div class="s-label">โหลด stats ไม่สำเร็จ</div></div>`;
}
</script>
</body>
</html>
