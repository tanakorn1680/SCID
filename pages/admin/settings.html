<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งค่าเว็บไซต์ — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap');
  :root{--navy:#1A6BA0;--gold:#D9A330;--ink:#1A3A52;--green-go:#3F8557;--danger:#E04433;--line:rgba(26,106,160,0.15);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'IBM Plex Sans Thai',sans-serif;background:#81CFF0;color:var(--ink);min-height:100vh;padding:16px 14px 40px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .back-link{font-size:13px;font-weight:600;color:var(--navy);text-decoration:none;}
  .page-title{font-family:'Baloo 2',sans-serif;font-size:18px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .page-title svg{width:20px;height:20px;flex-shrink:0;}
  .card{background:#fff;border-radius:13px;padding:16px;box-shadow:0 2px 10px rgba(0,40,80,0.08);margin-bottom:14px;}
  .card-title{font-size:14px;font-weight:700;margin-bottom:12px;}
  .field{margin-bottom:14px;}
  .field label{font-size:12.5px;font-weight:600;display:block;margin-bottom:5px;}
  .field input[type=text],.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;font-family:'IBM Plex Sans Thai',sans-serif;background:#fff;}
  .field textarea{min-height:70px;resize:vertical;}
  .field input[type=color]{width:60px;height:38px;border:1.5px solid var(--line);border-radius:8px;padding:2px;cursor:pointer;}
  .asset-preview{width:100%;max-width:220px;border-radius:10px;margin-bottom:10px;background:rgba(26,106,160,0.05);display:block;}
  .asset-preview.empty{padding:30px;text-align:center;color:rgba(26,58,82,0.4);font-size:12px;}
  .upload-btn{padding:9px 14px;background:rgba(26,106,160,0.08);color:var(--navy);border:none;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans Thai',sans-serif;}
  .submit-btn{width:100%;padding:12px 0;background:var(--navy);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;font-family:'Baloo 2',sans-serif;cursor:pointer;margin-top:6px;}
  .submit-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .card{background:rgba(255,255,255,0.92);border:1.5px solid rgba(255,255,255,0.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  .submit-btn{transition:opacity .18s,transform .12s cubic-bezier(.32,.72,0,1),box-shadow .18s;box-shadow:0 3px 10px rgba(26,106,160,0.2);}
  .submit-btn:active{transform:scale(0.97);opacity:0.88;box-shadow:0 1px 4px rgba(26,106,160,0.12);}
  .submit-btn:disabled{box-shadow:none;}
  .upload-btn{transition:background .15s,transform .12s cubic-bezier(.32,.72,0,1);}
  .upload-btn:active{transform:scale(0.95);background:rgba(26,106,160,0.14);}
  .field input[type=text]:focus,.field textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(33,150,201,0.15);}
  .back-link{transition:opacity .15s;}
  .back-link:active{opacity:0.65;}

  /* ── Dialog overlay (แทน confirm/alert) ── */
  .sc-overlay{position:fixed;inset:0;background:rgba(10,30,50,0.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .18s ease;}
  .sc-overlay.sc-show{opacity:1;pointer-events:all;}
  .sc-box{background:rgba(255,255,255,0.97);border:1.5px solid rgba(255,255,255,0.7);border-radius:18px;padding:24px 20px 18px;max-width:320px;width:100%;box-shadow:0 8px 32px rgba(0,40,80,0.18);transform:scale(0.94) translateY(8px);transition:transform .22s cubic-bezier(.32,.72,0,1);}
  .sc-overlay.sc-show .sc-box{transform:scale(1) translateY(0);}
  .sc-title{font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:800;color:#1A3A52;margin-bottom:8px;}
  .sc-msg{font-size:13px;color:rgba(26,58,82,0.75);line-height:1.6;margin-bottom:18px;}
  .sc-actions{display:flex;gap:8px;justify-content:flex-end;}
  .sc-btn{padding:9px 20px;border-radius:9px;border:none;font-size:13px;font-weight:700;font-family:'IBM Plex Sans Thai',sans-serif;cursor:pointer;transition:opacity .15s,transform .12s cubic-bezier(.32,.72,0,1);}
  .sc-btn:active{transform:scale(0.96);opacity:0.85;}
  .sc-btn.sc-cancel{background:rgba(26,58,82,0.1);color:#1A3A52;}
  .sc-btn.sc-danger{background:#E04433;color:#fff;}
  .sc-btn.sc-ok{background:#1A6BA0;color:#fff;}
  /* ── Toast ── */
  .sc-toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:calc(100vw - 32px);}
  .sc-toast{padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;font-family:'IBM Plex Sans Thai',sans-serif;box-shadow:0 4px 20px rgba(0,0,0,0.18);display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(12px) scale(0.96);transition:opacity .22s ease,transform .22s cubic-bezier(.32,.72,0,1);white-space:nowrap;}
  .sc-toast.sc-in{opacity:1;transform:translateY(0) scale(1);}
  .sc-toast.sc-out{opacity:0;transform:translateY(8px) scale(0.96);}
  .sc-toast.sc-success{background:#1F6B3A;color:#fff;}
  .sc-toast.sc-error{background:#C0392B;color:#fff;}
  .sc-toast.sc-info{background:#1A6BA0;color:#fff;}
  .sc-toast svg{width:15px;height:15px;flex-shrink:0;}
</style>
</head>
<body>

<div class="topbar">
  <a href="/pages/admin/dashboard.html" class="back-link">← Dashboard</a>
</div>
<div class="page-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> ตั้งค่าเว็บไซต์</div>

<div class="card">
  <div class="card-title">โลโก้</div>
  <img class="asset-preview" id="logoPreview" alt="Logo">
  <input type="file" id="logoFile" accept="image/jpeg,image/png,image/webp" style="display:none;">
  <button class="upload-btn" id="logoUploadBtn">อัปโหลดโลโก้ใหม่</button>
</div>

<div class="card">
  <div class="card-title">แบนเนอร์</div>
  <img class="asset-preview" id="bannerPreview" alt="Banner">
  <input type="file" id="bannerFile" accept="image/jpeg,image/png,image/webp" style="display:none;">
  <button class="upload-btn" id="bannerUploadBtn">อัปโหลดแบนเนอร์ใหม่</button>
</div>

<div class="card">
  <div class="card-title">ข้อความและเนื้อหา</div>
  <div class="field">
    <label>สีหลักของเว็บไซต์</label>
    <input type="color" id="fColor" value="#1A6BA0">
  </div>
  <div class="field">
    <label>ข้อความหน้าแรก</label>
    <textarea id="fHomeText" placeholder="เช่น ซื้อไอดี SimCity BuildIt พร้อมเล่น ส่งรวดเร็ว ปลอดภัย 100%"></textarea>
  </div>
  <div class="field">
    <label>ข้อความ Footer</label>
    <textarea id="fFooterText" placeholder="เช่น © 2026 Mayor Service สงวนลิขสิทธิ์"></textarea>
  </div>
  <div class="field">
    <label>ช่องทางติดต่อ</label>
    <textarea id="fContactInfo" placeholder="เช่น Line: @mayorservice, โทร 08x-xxx-xxxx"></textarea>
  </div>
  <div class="field">
    <label>ประกาศ (แสดงบนหน้าแรก ถ้ามี)</label>
    <textarea id="fAnnouncement" placeholder="เช่น ปิดปรับปรุงระบบวันที่ 25 ก.ค. เวลา 02:00-04:00 น."></textarea>
  </div>
  <button class="submit-btn" id="saveBtn">บันทึกการตั้งค่า</button>
</div>

<script type="module">
import { auth, admin } from '../../js/api.js';


// ── UI helpers (dialog + toast) ─────────────────────────────
const _ICONS = {
  success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  error:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
};
function _toastWrap() {
  let w = document.getElementById('_scTW');
  if (!w) { w = document.createElement('div'); w.id = '_scTW'; w.className = 'sc-toast-wrap'; document.body.appendChild(w); }
  return w;
}
function showToast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `sc-toast sc-${type}`;
  el.innerHTML = (_ICONS[type] ?? _ICONS.info) + msg;
  _toastWrap().appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('sc-in')));
  const dur = type === 'error' ? 3500 : 2500;
  setTimeout(() => {
    el.classList.remove('sc-in'); el.classList.add('sc-out');
    el.addEventListener('transitionend', () => el.remove(), { once: true });
  }, dur);
}
function _mkOverlay() {
  const o = document.createElement('div'); o.className = 'sc-overlay'; document.body.appendChild(o);
  requestAnimationFrame(() => requestAnimationFrame(() => o.classList.add('sc-show')));
  return o;
}
function _closeOverlay(o) {
  o.classList.remove('sc-show');
  o.addEventListener('transitionend', () => o.remove(), { once: true });
}
function showDialog({ title, msg, confirmLabel = 'ยืนยัน', confirmClass = 'sc-danger', onConfirm }) {
  const o = _mkOverlay();
  o.innerHTML = `<div class="sc-box"><div class="sc-title">${title}</div><div class="sc-msg">${msg}</div><div class="sc-actions"><button class="sc-btn sc-cancel" id="_scC">ยกเลิก</button><button class="sc-btn ${confirmClass}" id="_scOk">${confirmLabel}</button></div></div>`;
  o.addEventListener('click', e => { if (e.target === o) _closeOverlay(o); });
  o.querySelector('#_scC').addEventListener('click', () => _closeOverlay(o));
  o.querySelector('#_scOk').addEventListener('click', () => { _closeOverlay(o); onConfirm?.(); });
}
function showInfo(title, msg) {
  const o = _mkOverlay();
  o.innerHTML = `<div class="sc-box"><div class="sc-title">${title}</div><div class="sc-msg">${msg}</div><div class="sc-actions"><button class="sc-btn sc-ok" id="_scOk">ตกลง</button></div></div>`;
  o.addEventListener('click', e => { if (e.target === o) _closeOverlay(o); });
  o.querySelector('#_scOk').addEventListener('click', () => _closeOverlay(o));
}


const session = await auth.getSession();
if (!session) { window.location.href = '/pages/login.html'; }

const res = await fetch('/api/auth/profile', { headers: { Authorization: `Bearer ${session.access_token}` } });
const { data: profile } = await res.json();
if (profile?.role !== 'admin') { window.location.href = '/pages/shop.html'; }

function setPreview(imgEl, url) {
  if (url) {
    imgEl.src = url;
    imgEl.classList.remove('empty');
  } else {
    imgEl.removeAttribute('src');
    imgEl.classList.add('empty');
    imgEl.alt = 'ยังไม่มีรูป';
  }
}

async function loadSettings() {
  try {
    const { data: s } = await admin.settings.get();
    setPreview(document.getElementById('logoPreview'), s.logo_url);
    setPreview(document.getElementById('bannerPreview'), s.banner_url);
    document.getElementById('fColor').value       = s.primary_color || '#1A6BA0';
    document.getElementById('fHomeText').value    = s.home_text || '';
    document.getElementById('fFooterText').value  = s.footer_text || '';
    document.getElementById('fContactInfo').value = s.contact_info || '';
    document.getElementById('fAnnouncement').value = s.announcement || '';
  } catch (e) {
    showToast('โหลดการตั้งค่าไม่สำเร็จ', 'error');
  }
}

// อัปโหลด logo/banner — บันทึกลง site_settings ทันทีที่อัปโหลดสำเร็จ (ไม่ต้องกด "บันทึก" ซ้ำ)
document.getElementById('logoUploadBtn').addEventListener('click', () => document.getElementById('logoFile').click());
document.getElementById('bannerUploadBtn').addEventListener('click', () => document.getElementById('bannerFile').click());

document.getElementById('logoFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const { data } = await admin.uploadAsset('logo_url', file);
    setPreview(document.getElementById('logoPreview'), data.url);
    showToast('อัปโหลดโลโก้สำเร็จ', 'success');
  } catch (err) { showToast(err.message, 'error'); }
});

document.getElementById('bannerFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const { data } = await admin.uploadAsset('banner_url', file);
    setPreview(document.getElementById('bannerPreview'), data.url);
    showToast('อัปโหลดแบนเนอร์สำเร็จ', 'success');
  } catch (err) { showToast(err.message, 'error'); }
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try {
    await admin.settings.update({
      primary_color: document.getElementById('fColor').value,
      home_text:     document.getElementById('fHomeText').value.trim(),
      footer_text:   document.getElementById('fFooterText').value.trim(),
      contact_info:  document.getElementById('fContactInfo').value.trim(),
      announcement:  document.getElementById('fAnnouncement').value.trim(),
    });
    showToast('บันทึกการตั้งค่าสำเร็จ', 'success');
  } catch (e) {
    showToast(e.message, 'error');
  }
  btn.disabled = false; btn.textContent = 'บันทึกการตั้งค่า';
});

loadSettings();
</script>
</body>
</html>
