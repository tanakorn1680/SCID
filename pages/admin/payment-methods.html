<!DOCTYPE html>
<html lang="th">
<head>
  <link rel="icon" href="/api/favicon">
  <link rel="apple-touch-icon" href="/api/favicon">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ช่องทางชำระเงิน — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap');
  :root{--navy:#1A6BA0;--gold:#D9A330;--ink:#1A3A52;--green-go:#3F8557;--danger:#E04433;--line:rgba(26,106,160,0.15);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'IBM Plex Sans Thai',sans-serif;background:#81CFF0;color:var(--ink);min-height:100vh;padding:16px 14px 40px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .back-link{font-size:13px;font-weight:600;color:var(--navy);text-decoration:none;}
  .page-title{font-family:'Baloo 2',sans-serif;font-size:18px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .page-title svg{width:20px;height:20px;flex-shrink:0;}
  .card{background:#fff;border-radius:13px;padding:16px;box-shadow:0 2px 10px rgba(0,40,80,0.08);margin-bottom:14px;}
  .card-title{font-size:14px;font-weight:700;margin-bottom:12px;}
  .field{margin-bottom:12px;}
  .field label{font-size:12.5px;font-weight:600;display:block;margin-bottom:5px;}
  .field input,.field select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;font-family:'IBM Plex Sans Thai',sans-serif;background:#fff;}
  .submit-btn{width:100%;padding:12px 0;background:var(--navy);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;font-family:'Baloo 2',sans-serif;cursor:pointer;}
  .submit-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .form-alert{padding:9px 11px;border-radius:8px;font-size:12.5px;margin-top:10px;display:none;}
  .form-alert.show{display:block;}
  .form-alert.error{background:rgba(224,68,51,0.1);color:var(--danger);}
  .form-alert.success{background:rgba(63,133,87,0.1);color:var(--green-go);}
  .method-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px dotted var(--line);gap:10px;}
  .method-row:last-child{border-bottom:none;}
  .method-info{flex:1;}
  .method-label{font-size:13px;font-weight:700;}
  .method-meta{font-size:11.5px;color:rgba(26,58,82,0.5);margin-top:2px;}
  .row-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{background:rgba(26,106,160,0.08);border:none;border-radius:7px;padding:7px 10px;font-size:12px;cursor:pointer;color:var(--navy);font-family:'IBM Plex Sans Thai',sans-serif;}
  .icon-btn.danger{background:rgba(224,68,51,0.1);color:var(--danger);}
  .inactive{opacity:0.5;}
  .empty-state{text-align:center;padding:30px 20px;color:rgba(26,58,82,0.5);font-size:13px;}
  .card{background:rgba(255,255,255,0.92);border:1.5px solid rgba(255,255,255,0.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  .submit-btn{transition:opacity .18s,transform .12s cubic-bezier(.32,.72,0,1),box-shadow .18s;box-shadow:0 3px 10px rgba(26,106,160,0.2);}
  .submit-btn:active{transform:scale(0.97);opacity:0.88;box-shadow:0 1px 4px rgba(26,106,160,0.12);}
  .submit-btn:disabled{box-shadow:none;}
  .icon-btn{transition:background .15s,transform .12s cubic-bezier(.32,.72,0,1);}
  .icon-btn:active{transform:scale(0.92);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(33,150,201,0.15);}
  .back-link{transition:opacity .15s;}
  .back-link:active{opacity:0.65;}

  /* ── Themed dialog (แทน confirm/alert เดิม) ── */
  .dialog-overlay{position:fixed;inset:0;background:rgba(10,30,50,0.55);backdrop-filter:blur(3px);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;}
  .dialog-box{background:rgba(255,255,255,0.96);border:1.5px solid rgba(255,255,255,0.7);border-radius:18px;padding:24px 20px 18px;max-width:320px;width:100%;box-shadow:0 8px 32px rgba(0,40,80,0.18);}
  .dialog-title{font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:800;color:var(--ink);margin-bottom:8px;}
  .dialog-msg{font-size:13px;color:rgba(26,58,82,0.75);line-height:1.6;margin-bottom:18px;}
  .dialog-actions{display:flex;gap:8px;justify-content:flex-end;}
  .dialog-btn{padding:9px 20px;border-radius:9px;border:none;font-size:13px;font-weight:700;font-family:'IBM Plex Sans Thai',sans-serif;cursor:pointer;transition:opacity .15s,transform .12s;}
  .dialog-btn:active{transform:scale(0.96);opacity:0.85;}
  .dialog-btn.cancel{background:rgba(26,58,82,0.1);color:var(--ink);}
  .dialog-btn.confirm-danger{background:var(--danger);color:#fff;}
  .dialog-btn.confirm-ok{background:var(--navy);color:#fff;}

  /* ── SC Custom Select ───────────────────────────────────── */
  .sc-sel-wrap{position:relative;}
  .sc-sel-btn{width:100%;padding:10px 36px 10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;font-family:'IBM Plex Sans Thai',sans-serif;background:#fff;outline:none;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:border-color .15s,box-shadow .15s;color:var(--ink);}
  .sc-sel-btn:focus,.sc-sel-btn.open{border-color:var(--navy);box-shadow:0 0 0 3px rgba(33,150,201,0.15);}
  .sc-sel-btn .sc-chev{flex-shrink:0;width:16px;height:16px;color:rgba(26,58,82,0.4);transition:transform .18s;}
  .sc-sel-btn.open .sc-chev{transform:rotate(180deg);}
  .sc-sel-val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sc-sel-dd{position:absolute;top:calc(100% + 5px);left:0;right:0;background:rgba(255,255,255,0.98);border:1.5px solid rgba(26,106,160,0.18);border-radius:12px;box-shadow:0 8px 28px rgba(0,40,80,0.14);z-index:500;overflow:hidden;opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .18s,transform .18s;}
  .sc-sel-dd.open{opacity:1;pointer-events:all;transform:translateY(0);}
  .sc-sel-opt{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);transition:background .12s;gap:8px;}
  .sc-sel-opt:hover{background:rgba(26,106,160,0.06);}
  .sc-sel-opt.sel{background:rgba(26,106,160,0.09);color:var(--navy);}
  .sc-sel-opt .sc-check{width:15px;height:15px;flex-shrink:0;opacity:0;}
  .sc-sel-opt.sel .sc-check{opacity:1;}
  .sc-sel-btn:disabled,.sc-sel-btn[aria-disabled="true"]{opacity:0.45;cursor:not-allowed;pointer-events:none;}

</style>
</head>
<body>

<div class="topbar">
  <a href="/pages/admin/dashboard.html" class="back-link">← Dashboard</a>
</div>
<div class="page-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg> ช่องทางชำระเงิน</div>

<div class="card">
  <div class="card-title" id="formTitle">เพิ่มช่องทางใหม่</div>
  <div class="field">
    <label>ประเภท</label>
    <input type="hidden" id="fType" value="promptpay">
    <div class="sc-sel-wrap" id="fTypeWrap">
      <button type="button" class="sc-sel-btn" id="fTypeBtn" aria-haspopup="listbox" aria-expanded="false">
        <span class="sc-sel-val">PromptPay (สร้าง QR อัตโนมัติ)</span>
        <svg class="sc-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="sc-sel-dd" id="fTypeDd" role="listbox">
        <div class="sc-sel-opt sel" data-val="promptpay"><span>PromptPay (สร้าง QR อัตโนมัติ)</span><svg class="sc-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div class="sc-sel-opt" data-val="bank"><span>โอนธนาคาร</span><svg class="sc-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div class="sc-sel-opt" data-val="truemoney"><span>TrueMoney Wallet</span><svg class="sc-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>
    </div>
  </div>
  <div class="field">
    <label>ชื่อที่แสดงให้ลูกค้าเห็น</label>
    <input type="text" id="fLabel" placeholder="เช่น PromptPay ธนกร">
  </div>

  <div id="typeFields"></div>

  <button class="submit-btn" id="saveBtn">บันทึกช่องทางใหม่</button>
  <button class="submit-btn" id="cancelEditBtn" style="display:none;background:rgba(26,58,82,0.15);color:var(--ink);margin-top:8px;">ยกเลิกแก้ไข</button>
  <div class="form-alert" id="formAlert"></div>
</div>

<div class="card">
  <div class="card-title">ช่องทางทั้งหมด</div>
  <div id="methodList"><div class="empty-state">กำลังโหลด...</div></div>
</div>

<script type="module">
import { auth, admin } from '../../js/api.js';

const session = await auth.getSession();
if (!session) { window.location.href = '/pages/login.html'; }

const res = await fetch('/api/auth/profile', { headers: { Authorization: `Bearer ${session.access_token}` } });
const { data: profile } = await res.json();
if (profile?.role !== 'admin') { window.location.href = '/pages/shop.html'; }

let editingId = null;

// field ของแต่ละ type — ต้องตรงกับ contract ที่ checkout.html คาดหวังใน details jsonb
const TYPE_FIELDS = {
  promptpay: [
    { key: 'promptpay_id',  label: 'เบอร์พร้อมเพย์ (เช่น 0812345678)', type: 'tel' },
    { key: 'account_name',  label: 'ชื่อบัญชี (แสดงใต้ QR)' },
  ],
  bank: [
    { key: 'bank_name',      label: 'ชื่อธนาคาร' },
    { key: 'account_number', label: 'เลขบัญชี' },
    { key: 'account_name',   label: 'ชื่อบัญชี' },
  ],
  truemoney: [
    { key: 'phone_number', label: 'เบอร์โทร TrueMoney' },
    { key: 'account_name', label: 'ชื่อบัญชี' },
  ],
  // qr_code ไม่อยู่ในนี้ — ใช้ upload flow แยกต่างหาก ไม่ใช่ text input
};

let currentQrUrl = null;   // เก็บ URL รูป QR ที่อัปโหลดไว้ (สำหรับ type=qr_code เท่านั้น)

function renderTypeFields(type, existingDetails = {}) {
  if (type === 'qr_code') {
    currentQrUrl = existingDetails.image_url ?? null;
    renderQrUploadUI();
    return;
  }

  const fields = TYPE_FIELDS[type] || [];
  document.getElementById('typeFields').innerHTML = fields.map(f => `
    <div class="field">
      <label>${f.label}</label>
      <input type="${f.type ?? 'text'}" id="detail_${f.key}" data-detail-key="${f.key}" value="${existingDetails[f.key] ?? ''}">
    </div>
  `).join('');
}

function renderQrUploadUI() {
  document.getElementById('typeFields').innerHTML = `
    <div class="field">
      <label>รูป QR Code</label>
      ${currentQrUrl
        ? `<img src="${currentQrUrl}" alt="QR Code" style="max-width:180px;width:100%;border-radius:10px;margin-bottom:8px;display:block;">`
        : `<div class="hint" style="margin-bottom:8px;">ยังไม่มีรูป QR Code</div>`
      }
      <div style="display:flex;gap:8px;">
        <button type="button" class="icon-btn" id="qrUploadBtn">${currentQrUrl ? 'เปลี่ยนรูป' : 'อัปโหลดรูป QR'}</button>
        ${currentQrUrl ? `<button type="button" class="icon-btn danger" id="qrRemoveBtn">ลบรูป</button>` : ''}
      </div>
      <input type="file" id="qrFileInput" accept="image/jpeg,image/png,image/webp" style="display:none;">
    </div>
  `;

  document.getElementById('qrUploadBtn').addEventListener('click', () => {
    document.getElementById('qrFileInput').click();
  });

  document.getElementById('qrFileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const alertEl = document.getElementById('formAlert');
    try {
      const { data } = await admin.uploadPaymentQr(file);
      currentQrUrl = data.url;
      renderQrUploadUI();
    } catch (err) {
      alertEl.textContent = err.message;
      alertEl.className = 'form-alert show error';
    }
  });

  document.getElementById('qrRemoveBtn')?.addEventListener('click', () => {
    currentQrUrl = null;
    renderQrUploadUI();
  });
}

// fType custom select init
const fTypeSel = scSelect({
  wrapperId: 'fTypeWrap',
  inputId: 'fType',
  options: [
    { value: 'promptpay', label: 'PromptPay (สร้าง QR อัตโนมัติ)' },
    { value: 'bank',      label: 'โอนธนาคาร' },
    { value: 'truemoney', label: 'TrueMoney Wallet' },
  ],
  defaultValue: 'promptpay',
  onChange: (val) => renderTypeFields(val),
});
renderTypeFields('promptpay');

function collectDetails() {
  if (document.getElementById('fType').value === 'qr_code') {
    return currentQrUrl ? { image_url: currentQrUrl } : {};
  }
  const details = {};
  document.querySelectorAll('[data-detail-key]').forEach(input => {
    details[input.dataset.detailKey] = input.value.trim();
  });
  return details;
}

async function loadMethods() {
  const listEl = document.getElementById('methodList');
  try {
    const { data } = await admin.paymentMethods.list();

    if (!data.length) {
      listEl.innerHTML = `<div class="empty-state">ยังไม่มีช่องทางชำระเงิน</div>`;
      return;
    }

    const TYPE_LABEL = { promptpay: 'PromptPay (QR อัตโนมัติ)', bank: 'โอนธนาคาร', truemoney: 'TrueMoney', qr_code: 'QR Code (เก่า)' };

    listEl.innerHTML = data.map(m => `
      <div class="method-row ${m.is_active ? '' : 'inactive'}">
        <div class="method-info">
          <div class="method-label">${m.label}</div>
          <div class="method-meta">${TYPE_LABEL[m.type] ?? m.type} · ${m.is_active ? 'เปิดใช้งาน' : 'ปิดใช้งาน'}</div>
        </div>
        <div class="row-actions">
          <button class="icon-btn" data-edit="${m.id}">แก้ไข</button>
          <button class="icon-btn" data-toggle="${m.id}" data-active="${m.is_active}">${m.is_active ? 'ปิด' : 'เปิด'}</button>
          <button class="icon-btn danger" data-delete="${m.id}">ลบ</button>
        </div>
      </div>
    `).join('');

    listEl.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => {
        const m = data.find(x => x.id === btn.dataset.edit);
        startEdit(m);
      });
    });

    listEl.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try {
          await admin.paymentMethods.update(btn.dataset.toggle, { is_active: btn.dataset.active !== 'true' });
          loadMethods();
        } catch (e) { showInfo('เกิดข้อผิดพลาด', e.message); }
      });
    });

    listEl.querySelectorAll('[data-delete]').forEach(btn => {
      btn.addEventListener('click', () => {
        const methodName = btn.closest('.method-row')?.querySelector('.method-label')?.textContent ?? 'ช่องทางนี้';
        showDialog({
          title: 'ยืนยันการลบ',
          msg: `ลบ "${methodName}" ออก?<br><span style="font-size:11.5px;color:rgba(26,58,82,0.5);">หากมีออเดอร์ผูกอยู่จะปิดใช้งานแทน</span>`,
          confirmLabel: 'ลบ / ปิดใช้งาน',
          confirmClass: 'confirm-danger',
          onConfirm: async () => {
            try {
              const res = await admin.paymentMethods.remove(btn.dataset.delete);
              if (res?.data?.deactivated) {
                showInfo('ปิดใช้งานแล้ว', res.data.message);
              }
              loadMethods();
            } catch (e) { showInfo('เกิดข้อผิดพลาด', e.message); }
          },
        });
      });
    });

  } catch (e) {
    listEl.innerHTML = `<div class="empty-state">โหลดไม่สำเร็จ</div>`;
  }
}

function startEdit(m) {
  editingId = m.id;
  document.getElementById('formTitle').textContent = `แก้ไข: ${m.label}`;
  fTypeSel.setValue(m.type, true);
  fTypeSel.disable();  // เปลี่ยนประเภทหลังสร้างไม่ได้ (field ไม่ตรงกัน)
  document.getElementById('fLabel').value = m.label;
  renderTypeFields(m.type, m.details);
  document.getElementById('saveBtn').textContent = 'บันทึกการแก้ไข';
  document.getElementById('cancelEditBtn').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm() {
  editingId = null;
  document.getElementById('formTitle').textContent = 'เพิ่มช่องทางใหม่';
  fTypeSel.enable();
  fTypeSel.setValue('promptpay', true);
  document.getElementById('fLabel').value = '';
  renderTypeFields('promptpay');
  document.getElementById('saveBtn').textContent = 'บันทึกช่องทางใหม่';
  document.getElementById('cancelEditBtn').style.display = 'none';
}

document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

document.getElementById('saveBtn').addEventListener('click', async () => {
  const type    = document.getElementById('fType').value;
  const label   = document.getElementById('fLabel').value.trim();
  const details = collectDetails();
  const alertEl = document.getElementById('formAlert');
  const btn     = document.getElementById('saveBtn');

  if (!label) {
    alertEl.textContent = 'กรุณากรอกชื่อที่แสดงให้ลูกค้าเห็น';
    alertEl.className = 'form-alert show error';
    return;
  }

  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try {
    if (editingId) {
      await admin.paymentMethods.update(editingId, { label, details });
    } else {
      await admin.paymentMethods.create({ type, label, details });
    }
    alertEl.textContent = 'บันทึกสำเร็จ';
    alertEl.className = 'form-alert show success';
    resetForm();
    loadMethods();
  } catch (e) {
    alertEl.textContent = e.message;
    alertEl.className = 'form-alert show error';
    btn.disabled = false;
    btn.textContent = editingId ? 'บันทึกการแก้ไข' : 'บันทึกช่องทางใหม่';
    return;
  }
  btn.disabled = false;
  btn.textContent = editingId ? 'บันทึกการแก้ไข' : 'บันทึกช่องทางใหม่';
});

loadMethods();

// ── Themed dialog helpers ────────────────────────────────────────────
function removeDialog() {
  document.getElementById('scDialog')?.remove();
}

function showDialog({ title, msg, confirmLabel = 'ตกลง', confirmClass = 'confirm-ok', onConfirm }) {
  removeDialog();
  const overlay = document.createElement('div');
  overlay.id = 'scDialog';
  overlay.className = 'dialog-overlay';
  overlay.innerHTML = `
    <div class="dialog-box">
      <div class="dialog-title">${title}</div>
      <div class="dialog-msg">${msg}</div>
      <div class="dialog-actions">
        <button class="dialog-btn cancel" id="dlgCancel">ยกเลิก</button>
        <button class="dialog-btn ${confirmClass}" id="dlgConfirm">${confirmLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) removeDialog(); });
  document.getElementById('dlgCancel').addEventListener('click', removeDialog);
  document.getElementById('dlgConfirm').addEventListener('click', () => {
    removeDialog();
    onConfirm?.();
  });
}

function showInfo(title, msg) {
  removeDialog();
  const overlay = document.createElement('div');
  overlay.id = 'scDialog';
  overlay.className = 'dialog-overlay';
  overlay.innerHTML = `
    <div class="dialog-box">
      <div class="dialog-title">${title}</div>
      <div class="dialog-msg">${msg}</div>
      <div class="dialog-actions">
        <button class="dialog-btn confirm-ok" id="dlgOk">ตกลง</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) removeDialog(); });
  document.getElementById('dlgOk').addEventListener('click', removeDialog);
}

// ── SC Custom Select initializer ──────────────────────────
function scSelect(cfg) {
  const CHECK = '<svg class="sc-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const wrap  = document.getElementById(cfg.wrapperId);
  const input = document.getElementById(cfg.inputId);
  const btn   = wrap.querySelector('.sc-sel-btn');
  const valEl = wrap.querySelector('.sc-sel-val');
  const dd    = wrap.querySelector('.sc-sel-dd');

  function buildOpts(opts) {
    dd.innerHTML = opts.map(o =>
      `<div class="sc-sel-opt" data-val="${o.value}"><span>${o.label}</span>${CHECK}</div>`
    ).join('');
    dd.querySelectorAll('.sc-sel-opt').forEach(o =>
      o.addEventListener('click', () => { pick(o.dataset.val); close(); })
    );
  }
  buildOpts(cfg.options);

  function pick(val, silent) {
    const found = cfg.options.find(o => o.value === val) ?? cfg.options[0];
    if (!found) return;
    input.value = found.value;
    valEl.textContent = found.label;
    dd.querySelectorAll('.sc-sel-opt').forEach(o =>
      o.classList.toggle('sel', o.dataset.val === found.value));
    if (!silent) cfg.onChange?.(found.value);
  }
  pick(cfg.defaultValue ?? cfg.options[0]?.value, true);

  function open()  { btn.classList.add('open'); dd.classList.add('open'); btn.setAttribute('aria-expanded','true'); }
  function close() { btn.classList.remove('open'); dd.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }

  btn.addEventListener('click', e => { e.stopPropagation(); btn.classList.contains('open') ? close() : open(); });
  document.addEventListener('click', e => { if (!wrap.contains(e.target)) close(); });

  return {
    getValue()       { return input.value; },
    setValue(v, s)   { pick(v, s); },
    disable()        { btn.setAttribute('aria-disabled','true'); btn.disabled = true; },
    enable()         { btn.removeAttribute('aria-disabled'); btn.disabled = false; },
    setOptions(opts, def) { cfg.options = opts; buildOpts(opts); pick(def ?? opts[0]?.value, true); },
  };
}

</script>
</body>
</html>
